  --border: #E4D8C3;
  --border-strong: #D6CBB8;
  --ok: #5B7C3A;
  --warn: #C44536;
  --info: #4A6FA5;
  --ok-bg: #F1F5EA;
  --ok-bd: #BBCBA6;
  --warn-bg: #FBF0EE;

  --r-sm: 4px;
  --r-md: 10px;
  --r-lg: 16px;
  --sp-1: 6px;
  --sp-2: 10px;
  --sp-3: 14px;
  --sp-4: 20px;
  --sp-5: 28px;

/* ============================================================================
 * E3 AI 内容工厂 · 页面外壳样式
 * 纪律：本文件**不出现任何颜色字面量**（hex / rgb / hsl），一律 var(--*)/color-mix。
 *       selftest.py 会机械扫这一条；品牌色只在 build.py 生成的 :root{} 里声明一次。
 * ========================================================================== */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
}
h1, h2, h3, .kai { font-family: var(--font-display); font-weight: 700; }

/* ── 外壳 ─────────────────────────────────────────────────────────────── */
.fc-app { min-height: 100vh; display: flex; flex-direction: column; }

.fc-top {
  display: flex; align-items: center; gap: var(--sp-4);
  padding: var(--sp-3) var(--sp-5);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.fc-top .brand { display: flex; align-items: baseline; gap: var(--sp-2); }
.fc-top .brand b { font-family: var(--font-display); font-size: 21px; letter-spacing: .04em; }
.fc-top .brand i { font-style: normal; color: var(--text2); font-size: 13px; }
.fc-top .grow { flex: 1; }
.badge {
  font-size: 12px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--border-strong); color: var(--text2); background: var(--mut-bg);
}
.badge.ok { color: var(--ok-fg); background: var(--ok-bg); border-color: var(--ok-bd); }
.badge.bad { color: var(--warn-fg); background: var(--warn-bg); border-color: var(--warn-bd); }

.btn {
  font-family: var(--font-body); font-size: 14px; cursor: pointer;
  padding: 8px 16px; border-radius: var(--r-md);
  border: 1px solid var(--gold-deep); background: var(--gold-deep); color: var(--surface);
  transition: opacity .15s;
}
.btn:hover { opacity: .88; }
.btn.ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.xs { padding: 3px 9px; font-size: 12px; border-radius: var(--r-sm); }
.btn.primary { background: var(--gold-deepest); border-color: var(--gold-deepest); }

.fc-body { flex: 1; display: grid; grid-template-columns: 372px 1fr; align-items: start; }

/* ── 侧栏 ─────────────────────────────────────────────────────────────── */
.fc-side {
  border-right: 1px solid var(--border); padding: var(--sp-4);
  display: flex; flex-direction: column; gap: var(--sp-3);
  /* ⚠️ 底部必须留 `--sp-3` 的呼吸位，与 `_shared/shell.css` 的 `.side` **口径一致**：
     写成 `calc(100vh - 57px)` 会让侧栏底边**贴死视口折线**（实测 900→900 ⇒ 末行控件贴边，
     横向滚动条一出现就被盖住）。本外壳是手写的，不共享 shell.css ⇒ 这类分叉只能靠
     `_probe_side.mjs` 的「钉住后侧栏底边在视口内」拦住。 */
  position: sticky; top: 57px; max-height: calc(100vh - 57px - var(--sp-3)); overflow: auto;
}
.sec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.sec h3 {
  margin: 0; padding: var(--sp-2) var(--sp-3); font-size: 14px; letter-spacing: .05em;
  background: var(--surface2); border-bottom: 1px solid var(--border); color: var(--text);
}
.sec-b { padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
.sec.collapsible .sec-b { max-height: 460px; overflow: auto; }

.fld { display: flex; flex-direction: column; gap: 4px; }
.fld > span { font-size: 12px; color: var(--text2); }
.fld input, .fld select, .pt-row input {
  font-family: var(--font-body); font-size: 14px; color: var(--text);
  background: var(--surface3); border: 1px solid var(--border-strong);
  border-radius: var(--r-sm); padding: 7px 9px; width: 100%;
}
.fld input:focus, .fld select:focus { outline: 2px solid var(--gold-bd); outline-offset: 1px; }
.hint { margin: 0; font-size: 12px; color: var(--text2); }
.hint code { font-family: var(--font-num); font-size: 12px; background: var(--mut-bg); padding: 1px 5px; border-radius: var(--r-sm); }

.day-row { border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--sp-2); margin-bottom: var(--sp-2); background: var(--surface3); }
.day-hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.day-hd b { font-family: var(--font-display); }
.day-hd span { font-size: 12px; color: var(--text2); }
.dish-f { display: grid; grid-template-columns: 38px 1fr; align-items: center; gap: 6px; margin-bottom: 4px; }
.dish-f i { font-style: normal; font-size: 12px; color: var(--text2); }

.seg { display: flex; gap: 6px; }
.seg-b {
  flex: 1; font-family: var(--font-body); font-size: 13px; cursor: pointer; padding: 7px 4px;
  border: 1px solid var(--border-strong); background: var(--surface3); color: var(--text2);
  border-radius: var(--r-sm);
}
.seg-b.on { background: var(--gold-bg); border-color: var(--gold-bd); color: var(--gold-deepest); font-weight: 700; }

.sim, .sim-big {
  background: var(--gold-bg); border: 1px solid var(--gold-bd);
  border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3);
}
.sim .t, .sim-big .t { font-size: 12px; color: var(--gold-fg); }
.sim .v, .sim-big .v { font-family: var(--font-display); font-size: 24px; color: var(--gold-deepest); font-weight: 700; }
.sim-big .v { font-size: 34px; }
.sim .v small, .sim-big .v small { font-size: 13px; font-family: var(--font-body); color: var(--gold-fg); }
.sim .n, .sim-big .n { font-size: 12px; color: var(--gold-fg); }
.side-foot { display: flex; gap: var(--sp-2); }

/* ── 产出区 ───────────────────────────────────────────────────────────── */
.fc-main { padding: var(--sp-4); min-width: 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: var(--sp-3); flex-wrap: wrap; }
.tab {
  font-family: var(--font-display); font-size: 15px; cursor: pointer;
  padding: 8px 16px; border: none; background: none; color: var(--text2);
  border-bottom: 2px solid transparent;
}
.tab.on { color: var(--gold-deepest); border-bottom-color: var(--gold-deepest); }

.bar { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.bar .cnt { font-size: 13px; color: var(--text2); }
.bad, .good { font-family: var(--font-body); }
.bad { color: var(--warn-fg); }
.good { color: var(--ok-fg); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--sp-3); }
.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--sp-3); }

.card {
  margin: 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); overflow: hidden;
}
.card svg { display: block; width: 100%; height: auto; background: var(--bg); }
.card figcaption {
  display: flex; align-items: center; gap: 6px; padding: 8px 10px;
  font-size: 13px; color: var(--text2); border-top: 1px solid var(--border);
}
.card figcaption b { font-family: var(--font-display); color: var(--text); }
.card .acts { margin-left: auto; display: flex; gap: 5px; }

.cc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; display: flex; flex-direction: column; }
.cc header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface2); border-bottom: 1px solid var(--border); }
.cc header b { font-family: var(--font-display); font-size: 14px; }
.cc header span { font-size: 12px; color: var(--text2); }
.cc header .copy { margin-left: auto; }
.cc pre, pre.plain {
  margin: 0; padding: var(--sp-3); white-space: pre-wrap; word-break: break-word;
  font-family: var(--font-body); font-size: 13.5px; color: var(--text); flex: 1;
}
pre.plain { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); }

.two { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr); gap: var(--sp-4); align-items: start; }
.two .col-l, .two .col-r { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
.pt-row { display: flex; gap: 6px; margin-bottom: 6px; }

.chk { display: flex; flex-direction: column; gap: 6px; }
.chk-row {
  display: grid; grid-template-columns: 14px 300px 1fr; align-items: center; gap: var(--sp-2);
  padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface);
}
.chk-row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
.chk-row.no { border-color: var(--warn-bd); background: var(--warn-bg); }
.chk-row.no .dot { background: var(--warn); }
.chk-row b { font-weight: 600; }
.chk-row .d { font-size: 12.5px; color: var(--text2); word-break: break-word; }

#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
  background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 999px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: all .22s; z-index: 50;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1080px) {
  .fc-body { grid-template-columns: 1fr; }
  .fc-side { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
  .two { grid-template-columns: 1fr; }
  .chk-row { grid-template-columns: 14px 1fr; }
  .chk-row .d { grid-column: 2; }
}
</style>

    if (t.id === 'btnAddPt') {
      if ((ST.activity.points || []).length >= M.MAX_ACTIVITY_POINTS) {
        toast('卖点最多 ' + M.MAX_ACTIVITY_POINTS + ' 条：再多海报就放不下了'); return;
      }
      ST.activity.points = (ST.activity.points || []).concat(['新卖点']); M.save(ST); rerenderOut(); return;
    }
    if (t.hasAttribute('data-copy')) { copyText(t.closest('.cc').querySelector('pre').textContent, t); return; }

    var sc = curScene();
    if ((b = t.closest('[data-svg]'))) { var p1 = pick(b.getAttribute('data-svg')); if (p1) saveSvg(p1.svg, 'ABox菜单-' + p1.date); return; }
    if ((b = t.closest('[data-png]'))) {
      var p2 = pick(b.getAttribute('data-png'));
      if (p2) savePng(p2.svg, 'ABox菜单-' + p2.date).catch(function (er) { toast(er.message); });
      return;
    }
    if (t.hasAttribute('data-svg-a')) { saveSvg(P.render('activity', ST.days[0], sc), 'ABox活动-' + ST.days[0].date); return; }
    if (t.hasAttribute('data-png-a')) { savePng(P.render('activity', ST.days[0], sc), 'ABox活动-' + ST.days[0].date).catch(function (er) { toast(er.message); }); return; }
    if (t.hasAttribute('data-svg-r')) { saveSvg(P.render('recruit', ST.days[0], sc), 'ABox招募'); return; }
    if (t.hasAttribute('data-png-r')) { savePng(P.render('recruit', ST.days[0], sc), 'ABox招募').catch(function (er) { toast(er.message); }); return; }
  }

  function pick(date) {
    return curPosters().filter(function (p) { return p.date === date; })[0];
  }

  function onOutInput(e) {
    var t = e.target;
    if (t.hasAttribute('data-act')) { ST.activity[t.getAttribute('data-act')] = t.value; M.save(ST); refreshActivity(); return; }
    if (t.hasAttribute('data-pt')) {
      ST.activity.points[Number(t.getAttribute('data-pt'))] = t.value; M.save(ST); refreshActivity(); return;
    }
  }
  function refreshActivity() {
    var sc = curScene();
    var pre = $('#actText'); if (pre) pre.textContent = C.activityText(ST.days[0], sc);
    var holder = $('#actCard'); if (!holder) return;
    holder.innerHTML = '<figure class="card">' + P.render('activity', ST.days[0], sc)
      + '<figcaption>活动海报<span class="acts"><button class="btn ghost xs" data-svg-a="1">SVG</button>'
      + '<button class="btn xs" data-png-a="1">PNG</button></span></figcaption></figure>';
  }

  /* ── 启动 ─────────────────────────────────────────────────────────────── */

  function boot() {
    var v = $('#ver'); if (v) v.textContent = VERSION;

    /* ⚠️ 监听必须挂在 document 上：tab 按钮在 #tabs 里，而 #tabs 是 #panel 的**兄弟**，
     *    只挂 #panel 的话「切 tab」这类点击根本接不到（默认 tab 照常渲染 ⇒ 肉眼像正常）。
     *    实测踩过：探针点「朋友圈文案」无反应，才暴露。 */
    document.addEventListener('click', onClick);
    document.addEventListener('input', function (e) { onSide(e); onOutInput(e); });
    document.addEventListener('change', onSide);

    render();

    /* 探针入口：复用页面同一套函数，不另写判据 */
    window.FACTORY = {
      version: VERSION,
      state: function () { return ST; },
      setState: function (s) { ST = M.normalize(s); M.save(ST); render(); },
      posters: curPosters,
      scene: curScene,
      selfCheck: selfCheck,
      simulate: C.simulate,
      complianceScan: C.complianceScan,
      render: P.render,
      copy: C,
      model: M,
      poster: P,
      exportPng: function (i) { return svgToPngBlob(curPosters()[i].svg, 0.25); }
    };
    document.documentElement.setAttribute('data-factory-ready', '1');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
