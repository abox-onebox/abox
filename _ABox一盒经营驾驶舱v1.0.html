* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--gold-deep); }

/* ── 顶栏 ── */
.top {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.top .logo {
  font-family: var(--font-display);
  font-size: 19px; letter-spacing: .04em; color: var(--text);
}
.top .sub { font-size: 12px; color: var(--text2); }
.top .spacer { flex: 1; }
.top .ver { font-family: var(--font-num); font-size: 11px; color: var(--text-disabled); }

/* ── 页头 ── */
.hero { padding: var(--sp-4) var(--sp-4) 0; }
.hero h1 {
  font-family: var(--font-display); font-size: 25px; font-weight: 400;

.hero p { margin: 0; color: var(--text2); font-size: 13px; max-width: 78ch; }

/* ── 布局 ── */

  padding: var(--sp-3) var(--sp-4) var(--sp-5);
  align-items: flex-start;

/* ⚠️ 侧栏必须**自己能滚**（`max-height` + `overflow-y: auto`），这不是装饰：
   `position: sticky` 的元素一旦高于视口可用高度，底部会被**钉住不动** ——

   「筛选 / 操作（导出 · 导入 · 重置）」整组够不到；G1/G2/F3 在 1080 下也够不到。

.main { flex: 1; min-width: 0; }

}
.card > h2 {

}
.card > h2 .n { font-family: var(--font-num); font-size: 11px; color: var(--text-disabled); }

/* ── 表格 ── */

}
td { padding: 8px 9px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface3); }
td.num, th.num { text-align: right; font-family: var(--font-num); }
td.mono { font-family: var(--font-num); font-size: 12px; }
.big {

    U.on('click', '[data-act]', onClick);
    U.on('input', 'input, select', onInput);
    U.on('change', 'input, select', onInput);
    render();
    document.documentElement.setAttribute('data-tool-ready', '1');
  }

  g.M1 = {
    state: function () { return ST; },
    days: days, currentDay: curDay, orders: curOrders,
    /* ctx 是判据的**唯一输入面**：构建期自检与运行期探针都拿它（避免两份 ctx 口径漂移） */
    ctx: ctxOf,
    metrics: function () { return M.metrics(curOrders(), cpResolved()); },
    anomalies: function () { return M.anomalies(curOrders()); },
    pushText: buildPush,
    selfcheck: function () { return SC.run(ctxOf()); },
    allMetrics: function () { return M.metrics(SPEC.orders.list, cpResolved()); },
