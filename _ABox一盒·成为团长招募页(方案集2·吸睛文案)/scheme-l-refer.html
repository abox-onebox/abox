<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>方案 L · 介绍躺赚</title>
<style>
  :root{--bg:#F6F0E5;--bg-l:#FBF7EE;--ink:#6E5435;--ink-l:#8B7355;--gold:#C9A876;--gold-d:#B8915C;--line:#E6D9C0;--green:#5B7C3A;
    --sh:0 1px 2px rgba(110,84,53,.06),0 4px 12px rgba(110,84,53,.07);--shl:0 2px 6px rgba(110,84,53,.08),0 12px 32px rgba(110,84,53,.14);
    --kai:"KaiTi","STKaiti","楷体","Kaiti SC",serif;--r:14px;--s4:20px;--s5:28px;--sm:12px;--md:14px;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--kai);background:#2A2118;color:var(--ink);-webkit-font-smoothing:antialiased}
  .stage{display:flex;justify-content:center;align-items:flex-start;padding:32px 16px 60px}
  .phone{width:375px;max-width:100%;background:var(--bg);border-radius:24px;box-shadow:var(--shl),0 0 0 2px rgba(201,168,118,.3);overflow:hidden}
  .scroll{max-height:760px;overflow-y:auto}
  .scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(201,168,118,.45);border-radius:4px}
  .wrap{padding:var(--s5) var(--s4) 0;text-align:center}
  .eb{font-size:11px;letter-spacing:3px;color:var(--gold-d)}
  .t{font-size:26px;font-weight:bold;line-height:1.5;margin-top:14px}
  .fig{margin-top:var(--s5);background:var(--bg-l);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:24px 20px}
  .fig b{font-size:40px;color:var(--green);letter-spacing:1px}
  .fig span{display:block;font-size:var(--sm);color:var(--ink-l);margin-top:8px;line-height:1.7}
  .s{font-size:var(--md);line-height:1.9;color:var(--ink-l);margin-top:var(--s5)}
  .bar{padding:var(--s5) var(--s4) 0}
  .btn{width:100%;height:48px;line-height:48px;text-align:center;background:var(--green);color:#fff;border-radius:24px;font-size:var(--md);letter-spacing:2px;box-shadow:var(--sh);border:none;font-family:var(--kai)}
  .mini{display:flex;gap:12px;margin-top:12px}
  .mini a{flex:1;font-size:var(--sm);color:var(--gold-d);background:var(--bg-l);border:1px solid var(--line);border-radius:24px;padding:10px 0;text-align:center}
  .foot{font-size:11px;color:var(--ink-l);padding:var(--s4) var(--s4) var(--s5);line-height:1.8;margin-top:16px;text-align:center}
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="scroll">
  <div class="wrap">
    <div class="eb">不当团长 · 也能赚</div>
    <div class="t">你身边<br>就有一个合适的团长</div>
    <div class="fig"><b>¥30</b><span>介绍一位朋友当团长，他转正，你得 ¥30<br>动动手指的事，不用你出面干活</span></div>
    <div class="s">那位热心、人缘好的同事，<br>可能比你更适合。把机会给他。</div>
  </div>
  <div class="bar">
    <button class="btn">介绍朋友赚 ¥30</button>
    <div class="mini"><a>我也想自己当</a></div>
  </div>
  <div class="foot">介绍奖励为示例金额（待定）；仅单层，不涉及多级分销。</div>
</div></div></div>
</body>
</html>
