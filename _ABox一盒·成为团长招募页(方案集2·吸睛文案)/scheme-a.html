<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ABox 一盒 · 成为团长（招募页 · 精简品牌稿）</title>
<style>
  :root {
    --bg-cream: #F6F0E5; --bg-cream-light: #FBF7EE; --bg-cream-dark: #EFE5D0;
    --text-brown: #6E5435; --text-brown-light: #8B7355;
    --accent-gold: #C9A876; --accent-gold-dark: #B8915C;
    --border-soft: #E6D9C0; --warning: #C44536;
    --shadow: 0 1px 2px rgba(110, 84, 53, 0.06), 0 4px 12px rgba(110, 84, 53, 0.07);
    --shadow-lg: 0 2px 6px rgba(110, 84, 53, 0.08), 0 12px 32px rgba(110, 84, 53, 0.14);
    --font-kai: "KaiTi", "STKaiti", "楷体", "Kaiti SC", serif;
    --radius-md: 14px; --radius-pill: 24px;
    --sp-4: 20px; --sp-5: 28px; --fs-sm: 12px; --fs-md: 14px; --fs-title: 15.5px; --fs-h1: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-kai); background: #2A2118; color: var(--text-brown); -webkit-font-smoothing: antialiased; }
  .stage-flex { display: flex; justify-content: center; align-items: flex-start; padding: 32px 16px 60px; }
  .phone-shell { width: 375px; max-width: 100%; background: var(--bg-cream); border-radius: 24px; box-shadow: var(--shadow-lg), 0 0 0 2px rgba(201,168,118,.3); overflow: hidden; }
  .scroll { max-height: 760px; overflow-y: auto; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(201,168,118,.45); border-radius: 4px; }

  .hero { background: linear-gradient(135deg, #6E5435 0%, #9A7B4F 100%); color: var(--bg-cream); padding: 32px var(--sp-4) 28px; }
  .hero__eyebrow { font-size: 11px; letter-spacing: 3px; opacity: .85; border: 1px solid rgba(246,240,229,.45); border-radius: var(--radius-pill); display: inline-block; padding: 3px 14px; }
  .hero__title { font-size: 25px; font-weight: bold; letter-spacing: 2px; margin-top: 16px; line-height: 1.5; }
  .hero__sub { font-size: 14px; line-height: 1.85; opacity: .92; margin-top: 12px; }

  .income { padding: var(--sp-5) var(--sp-4) 0; }
  .income__big { font-size: 24px; font-weight: bold; color: var(--accent-gold-dark); letter-spacing: 1px; }
  .income__sub { font-size: var(--fs-sm); color: var(--text-brown-light); margin-top: 8px; line-height: 1.7; }

  .paths { padding: var(--sp-5) var(--sp-4) 0; display: flex; flex-direction: column; gap: 12px; }
  .paths__hd { font-size: var(--fs-h1); font-weight: 600; letter-spacing: 1.5px; padding-left: 12px; border-left: 4px solid var(--accent-gold); margin-bottom: 4px; }
  .path { background: var(--bg-cream-light); border: 1px solid var(--border-soft); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: 16px; }
  .path__tag { font-size: 11px; letter-spacing: 1px; color: var(--accent-gold-dark); border: 1px solid var(--accent-gold); border-radius: var(--radius-pill); padding: 2px 12px; display: inline-block; margin-bottom: 8px; }
  .path__t { font-size: var(--fs-title); font-weight: 600; }
  .path__d { font-size: var(--fs-md); color: var(--text-brown-light); line-height: 1.7; margin-top: 4px; }
  .path__reward { font-size: var(--fs-sm); color: #5B7C3A; margin-top: 6px; }
  .path__btn { display: block; width: 100%; height: 40px; line-height: 40px; text-align: center; margin-top: 12px; background: var(--text-brown); color: var(--bg-cream); border-radius: var(--radius-pill); font-size: var(--fs-sm); letter-spacing: 2px; box-shadow: var(--shadow); border: none; font-family: var(--font-kai); }
  .path__btn--ghost { background: transparent; color: var(--accent-gold-dark); border: 1px solid var(--accent-gold); box-shadow: none; }

  .foot { font-size: 11px; color: var(--text-brown-light); padding: var(--sp-4) var(--sp-4) var(--sp-5); line-height: 1.8; margin-top: 16px; }
</style>
</head>
<body>
<div class="stage-flex">
  <div class="phone-shell">
    <div class="scroll">

      <div class="hero">
        <span class="hero__eyebrow">团长招募</span>
        <div class="hero__title">帮同事凑个团<br>顺手带回来</div>
        <div class="hero__sub">你是办公室里相熟的人，把大家想要的凑成团，<br>取货时顺手带回来。不跑腿、不垫钱。</div>
      </div>

      <div class="income">
        <div class="income__big">每单按售价提 8% – 12%</div>
        <div class="income__sub">见习 8% · 正式 9% · 金牌 10% · 首席 12%<br>例：一单 ¥25.80，约提 ¥2.06 – ¥3.10</div>
      </div>

      <div class="paths">
        <div class="paths__hd">两种参与方式</div>
        <div class="path">
          <span class="path__tag">路径 A</span>
          <div class="path__t">自己当团长</div>
          <div class="path__d">绑定办公楼、填资料，提交即生效——立刻以见习（8%）开始接单。</div>
          <button class="path__btn">申请成为团长</button>
        </div>
        <div class="path">
          <span class="path__tag">路径 B</span>
          <div class="path__t">介绍朋友当</div>
          <div class="path__d">发专属链接，他转正团长，你拿一次性介绍奖励。</div>
          <div class="path__reward">奖励 ¥30 / 人（示例，待定）· 仅单层，不涉及多级分销</div>
          <button class="path__btn path__btn--ghost">介绍给合适的同事</button>
        </div>
      </div>

      <div class="foot">
        团长即办公室相熟同事，取货时顺手带给大家；见习 30 天未促单自动取消资格。
      </div>

    </div>
  </div>
</div>
</body>
</html>
