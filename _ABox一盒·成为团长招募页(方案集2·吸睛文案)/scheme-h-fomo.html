<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>方案 H · 隔壁楼已有团长（已作废）</title>
<style>
  :root{--bg:#F6F0E5;--bg-l:#FBF7EE;--ink:#6E5435;--ink-l:#8B7355;--gold:#C9A876;--gold-d:#B8915C;--line:#E6D9C0;--warm:#B85C38;
    --sh:0 1px 2px rgba(110,84,53,.06),0 4px 12px rgba(110,84,53,.07);--shl:0 2px 6px rgba(110,84,53,.08),0 12px 32px rgba(110,84,53,.14);
    --kai:"KaiTi","STKaiti","楷体","Kaiti SC",serif;--r:14px;--s4:20px;--s5:28px;--sm:12px;--md:14px;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--kai);background:#2A2118;color:var(--ink);-webkit-font-smoothing:antialiased}
  .stage{display:flex;justify-content:center;align-items:flex-start;padding:32px 16px 60px}
  .phone{width:375px;max-width:100%;background:var(--bg);border-radius:24px;box-shadow:var(--shl),0 0 0 2px rgba(201,168,118,.3);overflow:hidden}
  .scroll{max-height:760px;overflow-y:auto}
  .scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(201,168,118,.45);border-radius:4px}
  .hero{background:linear-gradient(150deg,#7A5A3A 0%,#5E452C 100%);color:var(--bg);padding:36px var(--s4) 30px}
  .eb{font-size:11px;letter-spacing:3px;opacity:.85;border:1px solid rgba(246,240,229,.4);border-radius:24px;display:inline-block;padding:3px 14px}
  .t{font-size:27px;font-weight:bold;letter-spacing:1px;margin-top:16px;line-height:1.45}
  .t em{color:var(--gold);font-style:normal}
  .s{font-size:var(--md);line-height:1.9;opacity:.92;margin-top:12px}
  .body{padding:var(--s5) var(--s4) 0}
  .lead{font-size:var(--md);line-height:1.9;color:var(--ink);background:var(--bg-l);border:1px solid var(--line);border-left:4px solid var(--warm);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
  .lead b{color:var(--warm)}
  .bar{padding:var(--s5) var(--s4) 0}
  .btn{width:100%;height:48px;line-height:48px;text-align:center;background:var(--warm);color:#fff;border-radius:24px;font-size:var(--md);letter-spacing:2px;box-shadow:var(--sh);border:none;font-family:var(--kai)}
  .mini{display:flex;gap:12px;margin-top:12px}
  .mini a{flex:1;font-size:var(--sm);color:var(--gold-d);background:var(--bg-l);border:1px solid var(--line);border-radius:24px;padding:10px 0;text-align:center}
  .foot{font-size:11px;color:var(--ink-l);padding:var(--s4) var(--s4) var(--s5);line-height:1.8;margin-top:16px;text-align:center}
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="scroll">
  <div style="background:#C44536;color:#fff;padding:12px 20px;font-size:13px;line-height:1.7;letter-spacing:1px">已作废 · 本方案立论“一栋楼一位团长、先到先得”是错误设定（2026-10-22 用户纠正）。真实口径：一栋楼可以有很多团长，每位只帮身边同事带几份，纯顺手。此案仅留档，不采用。</div>
  <div class="hero">
    <span class="eb">团长招募</span>
    <div class="t">隔壁楼<br>已经有<em>团长</em>了</div>
    <div class="s">你们楼的同事，还在各买各的、零零碎碎。<br>差的，只是一个张罗的人。</div>
  </div>
  <div class="body">
    <div class="lead">这事儿<b>可以先到先得</b>——一个楼先出一位团长。<br>让整层楼想要什么都顺手凑齐的那个人，可以是你。</div>
  </div>
  <div class="bar">
    <button class="btn">让我们楼也有一个</button>
    <div class="mini"><a>申请当团长</a><a>介绍朋友当</a></div>
  </div>
  <div class="foot">每单按售价提成 8%–12%；见习 30 天未促单自动取消资格。</div>
</div></div></div>
</body>
</html>
