        + r.todos.map(function (t) { return '· ' + esc(t); }).join('<br>') + '</div></div>' : '')
      + '</div>';
  }

  /* ── 渲染 ───────────────────────────────────────────────────── */
  function render() {
    U.$('#side').innerHTML = sideHTML();
    U.$('#main').innerHTML = '<div id="reminder">' + reminderHTML() + '</div>'
      + '<div id="ledger">' + tableHTML() + '</div>' + statusHTML() + gateHTML();
    var sel = U.$('#filter'); if (sel) sel.value = ST.filter;
  }
  /** 局部刷新某行的派生单元格（避免整体重渲染导致输入框失焦） */
  function touchRow(uid) {
    var it = ST.items.filter(function (x) { return x.uid === uid; })[0];
    var tr = U.$('[data-row="' + uid + '"]');
    if (!it || !tr) return;
    var ex = M.expiryOf(it, ST.today), d = M.daysLeft(it, ST.today);
    var p = tr.querySelector('[data-cell="exp"]'), dd = tr.querySelector('[data-cell="days"]');
    if (p) { p.className = 'pill ' + ex.tone; p.textContent = ex.label; }
    if (dd) dd.textContent = (d == null ? '—' : (d < 0 ? '超期 ' + Math.abs(d) + ' 天' : '剩 ' + d + ' 天'));
  }
  /** 重排表格，并**把手上的焦点接回原处**（否则每敲一个字符就掉焦点） */
  function reorderTable(uid, field) {
    var led = U.$('#ledger'); if (!led) return;
    var af = document.activeElement;
    var au = (af && af.getAttribute) ? af.getAttribute('data-uid') : null;
    var afd = (af && af.getAttribute) ? af.getAttribute('data-field') : null;
    var ss = null, se = null;
    try { ss = af ? af.selectionStart : null; se = af ? af.selectionEnd : null; } catch (e) { /* date/number 无选择区 */ }
    led.innerHTML = tableHTML();
    var target = U.$('[data-uid="' + (au || uid) + '"][data-field="' + (afd || field) + '"]');
    if (target && typeof target.focus === 'function') {
      target.focus();
      try { target.setSelectionRange(ss, se); } catch (e) { /* 同上 */ }
    }
  }

  /* ── 交互 ───────────────────────────────────────────────────── */
  function onClick(e, t) {
    var act = t.getAttribute('data-act');
    if (!act) return;
    if (act === 'add') {
      var it = M.makeItem({ name: '新证照', kind: 'company', holder: SPEC.subject.company, leadDays: 60, state: '待办理' });
      ST.items.push(it); save(); render();
      var el = U.$('[data-uid="' + it.uid + '"]'); if (el) el.focus();
    } else if (act === 'del') {
      var uid = t.getAttribute('data-uid');
      var cur = ST.items.filter(function (x) { return x.uid === uid; })[0];
      if (cur && g.confirm('删除「' + cur.name + '」？')) {
        ST.items = ST.items.filter(function (x) { return x.uid !== uid; });
        save(); render();
      }
    } else if (act === 'export-json') {
      U.download('ABox证照台账-' + ST.today + '.json', JSON.stringify({
        product: 'R1 证照与资质台账', version: VERSION, exportedAt: new Date().toISOString(),
        today: ST.today, items: ST.items,
      }, null, 2), 'application/json');
    } else if (act === 'export-csv') {
      var head = ['序号', '证照名称', '类别', '持证主体', '证号', '发证机关', '发证日', '到期日',
        '提前提醒天数', '状态', '到期档位', '剩余天数', '备注'];
      var rows = [head].concat(ST.items.map(function (it, i) {
        var ex = M.expiryOf(it, ST.today);
        return [i + 1, it.name, M.KIND_LABEL[it.kind] || it.kind, it.holder, it.no, it.issuer,
          it.issuedAt, it.expireAt || (it.permanent ? '长期有效' : ''), it.leadDays, it.state,
          ex.label, (function () { var d = M.daysLeft(it, ST.today); return d == null ? '' : d; })(), it.note];
      }));
      U.download('ABox证照台账-' + ST.today + '.csv', '\ufeff' + U.toCSV(rows), 'text/csv');
    } else if (act === 'import') {
      U.pickFile('.json', function (txt) {
        try {
          var o = JSON.parse(txt);
          var arr = Array.isArray(o) ? o : (o.items || []);
          if (!arr.length) throw new Error('文件里没有 items');
          ST.items = arr.map(M.makeItem); M.syncSeq(ST.items); save(); render();
          g.alert('已导入 ' + arr.length + ' 条');
        } catch (err) { g.alert('导入失败：' + err.message); }
      });
    } else if (act === 'reset') {
      if (g.confirm('重置为初始台账？当前编辑将丢失。')) {
        ST.items = M.seedFromSpec(SPEC); M.syncSeq(ST.items); save(); render();
      }
    }
  }

  function onInput(e, t) {
    if (t.id === 'q') { ST.q = t.value; render(); var q = U.$('#q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } return; }
    if (t.id === 'filter') { ST.filter = t.value; render(); return; }
    var uid = t.getAttribute('data-uid'), f = t.getAttribute('data-field');
    if (!uid || !f) return;
    var it = ST.items.filter(function (x) { return x.uid === uid; })[0];
    if (!it) return;
    /* ⚠️ 2026-09-26 修复：原先 `Number(t.value)` ⇒ 清空输入框等价于把提醒窗口设成 0 天，
       30 天后到期的证照从此不再提醒、提醒清单归零，而自检全绿。
       ⇒ 空 / 非数 / <1 走 leadDaysOf 回落真源默认 30。 */
    it[f] = f === 'leadDays' ? M.leadDaysOf(t.value) : t.value;
    save();
    // ⚠️ 影响**排序/档位**的字段改了，必须重排表格 —— 否则会出现
    //    「表里明明写着已过期，却还躺在列表最下面」这种自相矛盾的画面。
    //    非排序字段只刷新该行的派生单元格（避免整表重建导致输入卡顿）。
    if (['expireAt', 'state', 'leadDays'].indexOf(f) >= 0) reorderTable(uid, f);
    else touchRow(uid);
    // ⚠️ 只刷新行内单元格是不够的：**提醒清单与左栏汇总是编辑的直接后果**，
    //    不刷新就会出现「表里已显示临期、上方提醒清单还是空的」这种自相矛盾，
    //    而台账唯一的用途就是那张提醒清单。整体 render() 会让输入框失焦，故按块刷新。
    var rm = U.$('#reminder'); if (rm) rm.innerHTML = reminderHTML();
    var sd = U.$('#side'); if (sd) sd.innerHTML = sideHTML();
    var cur = U.$('[data-uid="' + uid + '"][data-field="' + f + '"]');
    if (cur && cur !== document.activeElement) { /* 保持原焦点，不抢 */ }
  }

  function boot() {
    load();
    var v = U.$('#ver'); if (v) v.textContent = VERSION;
    var d = U.$('#date'); if (d) d.textContent = ST.today;
    U.on('click', '[data-act]', onClick);
    U.on('input', 'input, select', onInput);
    U.on('change', 'input, select', onInput);
    render();
    document.documentElement.setAttribute('data-tool-ready', '1');
  }

  g.R1 = {
    state: function () { return ST; },
    setItems: function (arr) { ST.items = arr.map(M.makeItem); M.syncSeq(ST.items); render(); },
    render: render, selfcheck: function () { return SC.run(SPEC, ST.items, ST.today); },
    summary: function () { return M.summary(ST.items, ST.today); },
    reminders: function () { return M.reminders(ST.items, ST.today); },
    seed: function () { return M.seedFromSpec(SPEC); },
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script></body></html>
