          var cur = s.picks[slot];
          var list = M.dishesOfCategory(M.SLOT_CATEGORY[slot]);
          return '<td><select data-sku-f="pick-' + slot + '" data-sku="' + s.id + '">'
            + (list.length ? '' : '<option value="">（无同类菜）</option>')
            + list.map(function (d) {
              return '<option value="' + d.id + '"' + (d.id === cur ? ' selected' : '') + '>'
                + U.esc(d.name) + ' ¥' + d.cost.toFixed(2) + '</option>';
            }).join('')
            + (list.some(function (d) { return d.id === cur; }) ? ''
              : '<option value="' + cur + '" selected>（不匹配品类）</option>')
            + '</select></td>';
        }).join('')
        + '<td class="num mono">' + c.supplierTotal.toFixed(2) + '</td>'
        + '<td class="num mono">' + c.commission.toFixed(2) + '</td>'
        /* ⚠️ 2026-09-26 修复：这一列原先写 `c.costTotal`（含供价），
           与同行的「供价」列重复计数 ⇒ 表内数字配不平（14.00 / 16.50 / 6.98）。 */
        + '<td class="num mono">' + c.fulfilTotal.toFixed(2) + '</td>'
        + '<td class="num"><span class="big" data-cell="gp">' + c.platformGrossProfit.toFixed(2) + '</span></td>'
        + '<td class="num mono">' + (c.marginRate * 100).toFixed(1) + '%</td>'
        + '<td style="font-size:12.5px">' + (dear
          ? U.esc(dear.dish.name) + ' <span class="mono">¥' + dear.dish.cost.toFixed(2) + '</span>'
            + '<div class="hint" style="margin:0">' + M.slotName(dear.slot) + ' · '
            + U.esc(dear.dish.category ? M.categoryName(dear.dish.category) : '') + '</div>'
          : '<span class="pill warn">缺菜</span>') + '</td>'
        + '<td><button class="btn sm ghost" data-act="del-sku" data-sku="' + s.id + '">删除</button></td>'
        + '</tr>';
    }).join('');
    return '<div class="card"><h2>成本卡 <span class="n">一对一饭四菜 · 主食用米不建菜品项</span></h2>'
      + '<p class="hint">供价 = 逐菜协商采购价之和（真源 <span class="mono">ab_dish.cost_price</span>）；'
      + '毛利 = 售价 −（供价 + 场所摊销 + 打包人工 + 配送费）− 佣金 —— 公式与 '
      + '<span class="mono">biz.ts · calcSettlement()</span> 逐字一致。</p>'
      + '<div class="tw"><table><thead>' + head + '</thead><tbody>'
      + (body || '<tr><td colspan="11" class="hint">还没有套餐</td></tr>') + '</tbody></table></div></div>';
  }

  /* ── 看板 ───────────────────────────────────────────────────── */
  function boardHTML() {
    var cp = costParamsResolved();
    var seg = '<div class="seg">'
      + ['sku|按套餐', 'building|按楼', 'day|按天'].map(function (x) {
        var k = x.split('|')[0];
        return '<button data-act="board" data-k="' + k + '"' + (ST.board === k ? ' class="on"' : '') + '>'
          + x.split('|')[1] + '</button>';
      }).join('') + '</div>';
    var inner = '';

    if (ST.board === 'sku') {
      var rows = M.bySku(ST.skus, cp);
      inner = '<div class="tw"><table><thead><tr><th>套餐</th><th class="num">售价</th>'
        + '<th class="num">单份毛利</th><th class="num">毛利率</th><th>最贵的菜</th></tr></thead><tbody>'
        + rows.map(function (r) {
          return '<tr><td><b>' + U.esc(r.sku.name) + '</b></td>'
            + '<td class="num mono">' + Number(r.sku.price).toFixed(2) + '</td>'
            + '<td class="num"><span class="big">' + r.card.platformGrossProfit.toFixed(2) + '</span></td>'
            + '<td class="num mono">' + (r.card.marginRate * 100).toFixed(1) + '%</td>'
            + '<td style="font-size:12.5px">' + (r.card.dearest ? U.esc(r.card.dearest.dish.name) : '—') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    } else if (ST.board === 'building') {
      var brow = M.byBuilding(ST.skus, cp, ST.bldParams);
      var tq = U.sum(brow, function (r) { return r.qty; });
      var tg = U.sum(brow, function (r) { return r.gross; });
      inner = '<div class="kpis" style="margin-bottom:10px">'
        + '<div class="kpi"><div class="k">合计日单量</div><div class="v">' + tq + '</div></div>'
        + '<div class="kpi"><div class="k">合计日毛利</div><div class="v">' + tg.toFixed(0) + '<span class="u">元</span></div></div>'
        + '</div>'
        + '<div class="tw"><table><thead><tr><th>楼栋</th><th>状态</th><th>主推套餐</th>'
        + '<th class="num">预计日单</th><th class="num">日营收</th><th class="num">日毛利</th></tr></thead><tbody>'
        + brow.map(function (r) {
          var st = { 1: ['营业中', 'ok'], 2: ['待开通', 'gold'], 3: ['已暂停', 'dim'] }[r.building.status] || ['?', 'dim'];
          return '<tr><td><b>' + U.esc(r.building.name) + '</b><div class="hint" style="margin:0">'
            + U.esc(r.building.address) + ' · 约 ' + (r.building.population || '—') + ' 人</div></td>'
            + '<td><span class="pill ' + st[1] + '">' + st[0] + '</span></td>'
            + '<td><select data-bld-sku="' + r.building.id + '">'
            + ST.skus.map(function (s) {
              return '<option value="' + s.id + '"' + (s.id === (ST.bldParams[r.building.id] || {}).skuId ? ' selected' : '') + '>'
                + U.esc(s.name) + '</option>';
            }).join('') + '</select></td>'
            + '<td class="num"><input data-bld-qty="' + r.building.id + '" type="number" min="0" step="1" value="'
            + r.qty + '" style="width:72px;text-align:right"></td>'
            + '<td class="num mono">' + r.revenue.toFixed(0) + '</td>'
            + '<td class="num mono">' + r.gross.toFixed(0) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
        + '<p class="hint" style="margin:10px 0 0">⚠️ 单量为<b>空跑假设</b>（营业中楼先按 20 单/日），'
        + '不是真实数据 —— 上线后应用真实订单量替换。</p>';
    } else {
      var drows = M.byDay(ST.skus, cp, ST.bldParams, ST.dayFactor);
      inner = '<div class="tw"><table><thead><tr><th>星期</th><th class="num">系数</th>'
        + '<th class="num">预计单量</th><th class="num">预计毛利</th><th>占比</th></tr></thead><tbody>'
        + drows.map(function (r, i) {
          var max = Math.max.apply(null, drows.map(function (x) { return x.gross; })) || 1;
          return '<tr><td><b>' + r.label + '</b></td>'
            + '<td class="num"><input data-day="' + i + '" type="number" step="0.1" min="0" value="' + r.factor
            + '" style="width:64px;text-align:right"></td>'
            + '<td class="num mono">' + r.qty + '</td>'
            + '<td class="num mono">' + r.gross.toFixed(0) + '</td>'
            + '<td><div class="bar"><i style="width:' + Math.round(r.gross / max * 100) + '%"></i></div></td></tr>';
        }).join('') + '</tbody></table></div>'
        + '<p class="hint" style="margin:10px 0 0">⚠️ 周内系数（周末写字楼单量骤降）为<b>假设值</b>，可改。</p>';
    }
    return '<div class="card"><h2>毛利看板</h2><div style="margin-bottom:10px">' + seg + '</div>' + inner + '</div>';
  }

  /* ── 调价模拟器 ─────────────────────────────────────────────── */
  function simHTML() {
    var cp = costParamsResolved();
    var rows = M.bySku(ST.skus, cp);
    return '<div class="card"><h2>调价模拟器 <span class="n">目标毛利率 → 需要的售价</span></h2>'
      + '<label class="f" style="max-width:260px"><span>目标毛利率（%）</span>'
      + '<input data-param="targetMargin" type="number" step="1" min="0" max="90" value="'
      + Math.round(ST.targetMargin * 100) + '"></label>'
      + '<div class="tw"><table><thead><tr><th>套餐</th><th class="num">当前售价</th>'
      + '<th class="num">当前毛利</th><th class="num">当前毛利率</th>'
      + '<th class="num">达到目标需定价</th><th>与当前差</th></tr></thead><tbody>'
      + rows.map(function (r) {
        var need = M.priceForTargetMargin(r.card.costTotal, r.card.rate, ST.targetMargin);
        var delta = need == null ? null : Number((need - Number(r.sku.price)).toFixed(2));
        return '<tr><td><b>' + U.esc(r.sku.name) + '</b></td>'
          + '<td class="num mono">' + Number(r.sku.price).toFixed(2) + '</td>'
          + '<td class="num mono">' + r.card.platformGrossProfit.toFixed(2) + '</td>'
          + '<td class="num mono">' + (r.card.marginRate * 100).toFixed(1) + '%</td>'
          + '<td class="num">' + (need == null
            ? '<span class="pill warn">不可达</span>'
            : '<span class="big">' + need.toFixed(2) + '</span>') + '</td>'
          + '<td>' + (delta == null ? '—'
            : '<span class="pill ' + (delta > 0 ? 'warn' : 'ok') + '">'
              + (delta > 0 ? '涨 ' : '降 ') + Math.abs(delta).toFixed(2) + ' 元</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>'
      + '<p class="hint" style="margin:10px 0 0">反算公式：价 = 成本 ÷ (1 − 佣金率 − 目标毛利率)。'
      + '分母 ≤ 0 时数学上不可达（费率+目标率 ≥ 100%）。</p></div>';
  }

  /* ── 自检 ───────────────────────────────────────────────────── */
  function gateHTML() {
    var r = SC.run({ skus: ST.skus, costParams: costParamsResolved(), bldParams: ST.bldParams, dayFactor: ST.dayFactor });
    return '<div class="card"><h2>自检 <span class="n">' + (r.ok ? '全绿' : r.bad + ' 项不符') + '</span></h2>'
      + '<div class="gate">' + r.rows.map(function (x, i) {
        return '<div class="g' + (x.ok ? '' : ' bad') + '"><i>' + String(i + 1).padStart(2, '0') + '</i>'
          + '<span class="t">' + (x.ok ? '✔ ' : '✗ ') + U.esc(x.name)
          + (x.detail ? ' —— ' + U.esc(x.detail) : '') + '</span></div>';
      }).join('') + '</div></div>';
  }

  function render() {
    applyPrice();
    U.$('#side').innerHTML = sideHTML();
    U.$('#main').innerHTML = '<div id="cost">' + costTableHTML() + '</div>' + boardHTML() + simHTML() + gateHTML();
  }
  function renderHeavy() {
    applyPrice();
    U.$('#side').innerHTML = sideHTML();
    U.$('#main').innerHTML = '<div id="cost">' + costTableHTML() + '</div>'
      + boardHTML() + simHTML() + gateHTML();
  }

  /* ── 交互 ───────────────────────────────────────────────────── */
  function onClick(e, t) {
    var act = t.getAttribute('data-act');
    if (!act) return;
    if (act === 'add-sku') {
      var s = M.blankSku('新套餐');
      s.picks[1] = (M.dishesOfCategory('main')[0] || {}).id;
      s.picks[2] = (M.dishesOfCategory('half')[0] || {}).id;
      s.picks[3] = (M.dishesOfCategory('veg')[0] || {}).id;
      s.picks[4] = (M.dishesOfCategory('soup')[0] || {}).id;
      ST.skus.push(s); normalize(); save(); render();
    } else if (act === 'del-sku') {
      var id = t.getAttribute('data-sku');
      var cur = ST.skus.filter(function (x) { return x.id === id; })[0];
      if (cur && g.confirm('删除「' + cur.name + '」？')) {
        ST.skus = ST.skus.filter(function (x) { return x.id !== id; });
        normalize(); save(); render();
      }
    } else if (act === 'board') {
      ST.board = t.getAttribute('data-k'); save(); render();
    } else if (act === 'export-json') {
      U.download('ABox成本卡-' + ST.today + '.json', JSON.stringify({
        product: 'S2 成本卡与毛利测算', version: VERSION, exportedAt: new Date().toISOString(),
        price: ST.price, costParams: costParamsResolved(), skus: ST.skus,
        bldParams: ST.bldParams, dayFactor: ST.dayFactor,
      }, null, 2), 'application/json');
    } else if (act === 'export-csv') {
      var cp = costParamsResolved();
      var head = ['套餐', '佣金等级'].concat(SLOTS.map(function (s) { return M.slotName(s); }))
        .concat(['售价', '供价合计', '佣金', '履约成本合计', '单份毛利', '毛利率', '最贵的菜', '最贵菜成本']);
      var rows = [head].concat(ST.skus.map(function (s) {
        var c = M.costCard(s, cp);
        return [s.name, c.levelLabel + ' ' + Math.round(c.rate * 100) + '%']
          .concat(SLOTS.map(function (slot) { return (M.DISH[s.picks[slot]] || {}).name || ''; }))
          /* ⚠️ 同上：CSV 的「履约成本合计」也曾经写 costTotal（含供价），与页面上同错 */
          .concat([Number(s.price).toFixed(2), c.supplierTotal.toFixed(2), c.commission.toFixed(2),
            c.fulfilTotal.toFixed(2), c.platformGrossProfit.toFixed(2), (c.marginRate * 100).toFixed(1) + '%',
            c.dearest ? c.dearest.dish.name : '', c.dearest ? c.dearest.dish.cost.toFixed(2) : '']);
      }));
      U.download('ABox成本卡-' + ST.today + '.csv', '\ufeff' + U.toCSV(rows), 'text/csv');
    } else if (act === 'reset') {
      if (g.confirm('重置为默认三套餐与参数？')) { U.store.del(KEY); load(); render(); }
    }
  }

  function onInput(e, t) {
    var param = t.getAttribute('data-param');
    if (param) {
      if (param === 'price') ST.price = Math.max(0, Number(t.value) || 0);
      else if (param === 'targetMargin') ST.targetMargin = Math.max(0, Math.min(0.9, (Number(t.value) || 0) / 100));
      else if (param === 'level') { ST.skus.forEach(function (s) { s.level = t.value; }); }
      /* ⚠️ 2026-09-26 修复：原先 `Number(t.value)` 不设下界 ⇒ 填 -5 时
         ① 毛利被反向抬高（实测 6.98 ⇒ 12.98）
         ② 页面同时打印「尚未登记（**当前按 0 计**）」—— 提示与实际取值相反
         `<input min="0">` 只管表单校验、管不了 input.value，必须自己判。
         负数 / 非数一律回落 null（视为尚未登记），与 M1 / g1 / g2 的空值纪律一致。 */
      else {
        var num = Number(t.value);
        ST.costParams[param] = (t.value !== '' && isFinite(num) && num >= 0) ? num : null;
      }
      save();
      if (param === 'targetMargin') { U.$('#main').innerHTML = '<div id="cost">' + costTableHTML() + '</div>' + boardHTML() + simHTML() + gateHTML(); }
      else renderHeavy();
      var back = U.$('[data-param="' + param + '"]'); if (back) back.focus();
      return;
    }
    var bk = t.getAttribute('data-bld-qty');
    if (bk) {
      ST.bldParams[bk] = ST.bldParams[bk] || {}; ST.bldParams[bk].qty = Math.max(0, Number(t.value) || 0);
      save(); renderHeavy(); return;
    }
    var bs = t.getAttribute('data-bld-sku');
    if (bs) { ST.bldParams[bs] = ST.bldParams[bs] || {}; ST.bldParams[bs].skuId = t.value; save(); renderHeavy(); return; }
    var dk = t.getAttribute('data-day');
    if (dk != null) { ST.dayFactor[Number(dk)] = Math.max(0, Number(t.value) || 0); save(); renderHeavy(); return; }

    var skuId = t.getAttribute('data-sku'), f = t.getAttribute('data-sku-f');
    if (!skuId || !f) return;
    var sku = ST.skus.filter(function (x) { return x.id === skuId; })[0];
    if (!sku) return;
    if (f.indexOf('pick-') === 0) sku.picks[Number(f.slice(5))] = Number(t.value);
    else if (f === 'name') sku.name = t.value;
    else if (f === 'level') sku.level = t.value;
    save(); renderHeavy();
  }

  function boot() {
    load();
    var v = U.$('#ver'); if (v) v.textContent = VERSION;
    var d = U.$('#date'); if (d) d.textContent = ST.today;
    U.on('click', '[data-act]', onClick);
    U.on('input', 'input, select', onInput);
    U.on('change', 'input, select', onInput);
    render();
    document.documentElement.setAttribute('data-tool-ready', '1');
  }

  g.S2 = {
    state: function () { return ST; },
    costParams: costParamsResolved,
    cards: function () { return M.bySku(ST.skus, costParamsResolved()); },
    byBuilding: function () { return M.byBuilding(ST.skus, costParamsResolved(), ST.bldParams); },
    byDay: function () { return M.byDay(ST.skus, costParamsResolved(), ST.bldParams, ST.dayFactor); },
    selfcheck: function () {
      return SC.run({ skus: ST.skus, costParams: costParamsResolved(), bldParams: ST.bldParams, dayFactor: ST.dayFactor });
    },
    setState: function (patch) { Object.keys(patch || {}).forEach(function (k) { ST[k] = patch[k]; }); normalize(); render(); },
    render: render,
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script></body></html>
