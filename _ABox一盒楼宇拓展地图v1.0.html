  function todosHTML(s) {

  function missingHTML() {
    var gaps = ST.leads.map(function (l) { return { l: l, s: sc(l) }; })

      .sort(function (a, b) { return b.s.missing.length - a.s.missing.length; });

  function factorsHTML() {
    var wsum = M.weightSum(ST.weights);
    return '<div class="card"><h2>打分模型 <span class="n">规则 + 权重 · 和为 ' + wsum.toFixed(2) + '</span></h2>'
      + '<p class="hint">每一项都是「这栋楼值不值得进」的属性，不是「我们已经做到哪」。'
      + '归一化：ramp 型 = 值 ÷ 上限（截到 1）；range 型 = 把 [下限, 上限] 线性拉到 0–1。</p>'
      + '<div class="tw"><table><thead><tr><th style="width:190px">因子</th><th style="width:66px">权重</th>'
      + '<th style="width:130px">归一化</th><th style="width:96px">数据来源</th><th>为什么算它</th>'
      + '</tr></thead><tbody>'
      + M.FACTORS.map(function (f) {
        var norm = f.kind === 'range' ? '（值 − ' + f.floor + '）÷ ' + (f.cap - f.floor) + '，截到 0–1'

          + '<td class="mono" style="font-size:11.5px">' + U.esc(norm) + '</td>'
          + '<td><span class="pill ' + (f.src === '真源（population）' ? 'ok' : (f.src === '算出（真源楼栋 + 阶段）' ? 'info' : 'gold')) + '">'
          + U.esc(f.src) + '</span></td>'
          + '<td class="hint" style="color:var(--text2)">' + U.esc(f.why) + '</td></tr>';
      }).join('')
      + '</tbody></table></div>'
      + '<p class="hint" style="margin-top:10px">分档：' + M.BANDS.map(function (b) {
        return b.key + ' ≥ ' + b.min + '（' + b.label + '，' + b.why + '）'; }).join(' · ') + '。</p>'
      + '</div>';

  function issuesHTML(s) {
    var is = s.issues;
    if (!is.bad) {
      return '<div class="card"><h2>台账缺陷 <span class="n">无</span></h2>'
        + '<div class="note ok">✔ 已谈/在谈的 ' + is.engaged.length
        + ' 栋都有负责人 + 下一步 + 到期日；已放弃的都写了原因、记了谈到哪。</div></div>';
    }
    var blk = function (title, arr, why) {
      if (!arr.length) return '';
      return '<div class="note warn" style="margin-bottom:8px"><div><b>' + title + ' ×' + arr.length + '</b>'
        + '<div class="hint" style="margin:2px 0 4px">' + why + '</div>'
        + arr.map(function (l) { return '<span class="pill warn" style="margin:0 4px 4px 0">#'
          + U.esc(l.id) + ' ' + U.esc(l.name) + '</span>'; }).join('') + '</div></div>';
    };
    return '<div class="card"><h2>台账缺陷 <span class="n">' + is.bad + ' 处</span></h2>'
      + '<p class="hint">都是「谈过但没记全」—— 这正是 G1 要解决的那个问题（谈过的楼散在聊天记录里）。</p>'
      + blk('缺负责人', is.noOwner, '没人跟 ⇒ 一定会忘')
      + blk('缺下一步', is.noAction, '没写「下一步做什么」⇒ 这条线索等于停了')
      + blk('到期日非法或缺失', is.badDue, '写了下一步却没写什么时候做')
      + blk('已放弃但没写原因', is.noReason, '两周后就忘了为什么没成，会重复踩同一个坑')
      + blk('已放弃但没记「谈到哪」', is.noReach, '漏斗算不出它走到过哪一步')
      + '</div>';

  function gateHTML() {
    var r = SC.run(ctxOf());
    return '<div class="card"><h2>自检 <span class="n">' + (r.ok ? '全绿' : r.bad + ' 项不符') + '</span></h2>'
      + '<div class="gate">' + r.rows.map(function (x, i) {
        return '<div class="g' + (x.ok ? '' : ' bad') + '"><i>' + String(i + 1).padStart(2, '0') + '</i>'
          + '<span class="t">' + (x.ok ? '✔ ' : '✗ ') + U.esc(x.name)
          + (x.detail ? ' —— ' + U.esc(x.detail) : '') + '</span></div>';
      }).join('') + '</div></div>';
  }

  function renderSide() { var el = U.$('#side'); if (el) el.innerHTML = sideHTML(); }
  /* 只刷侧栏那一个条数（整栏重绘会丢输入焦点，故单独更新） */
  function updateCount() {
    var e = U.$('#filtCount');
    if (e) e.textContent = rows().length + ' / ' + ST.leads.length + ' 条';
  }
  /* 改权重时也只重绘主区（保输入焦点）⇒ 侧栏那句提示必须**定向更新**。
     ⚠️ 之前只重绘主区、不动侧栏，结果是：权重和明明 ≠ 1，警告却一条都不显示 ——
     一个「只在你停止输入后才出现」的警告等于没有警告。 */
  function updateWSum() {
    var wsum = M.weightSum(ST.weights), off = Math.abs(wsum - 1) > 1e-9;
    var h = U.$('#wSum');
    if (h) h.textContent = off ? '和为 ' + wsum.toFixed(2) + ' ⚠️ 应为 1' : '和为 1.00';
    var box = U.$('#wWarn');
    if (box) box.innerHTML = off
      ? '<div class="note warn">权重和不为 1 ⇒ 分数仍按「有数据因子的权重和」归一化，'
        + '但<b>跨行可比性</b>会变差。点「归一化到 1」即可。</div>' : '';
  }
  function renderMain() {
    var el = U.$('#main');
    if (!el) return;
    var s = sum();
    el.innerHTML = kpiHTML(s) + funnelHTML(s) + todosHTML(s) + tableHTML()
      + missingHTML() + issuesHTML(s) + factorsHTML() + gateHTML();
    restoreFocus();
  }
  function render() { renderSide(); renderMain(); }

  /* 主区重绘后复原焦点（行内编辑不被重绘打断） */
  function restoreFocus() {
    var f = ST.focus;
    if (!f) return;
    var sel = f.lead ? '[data-lead="' + f.lead + '"][data-field="' + f.field + '"]'
      : '[data-param="' + f.field + '"]';
    var back = U.$(sel);
    if (back) { back.focus(); try { back.setSelectionRange(f.pos, f.pos); } catch (e) { /* number 型不支持 */ } }
  }

  /* 单元格编辑器工厂（挂在 Model 上，供判据与探针复用同一份写法） */
  function cell(field, lead, opt) {
    var v = lead[field];
    var attrs = ' data-lead="' + U.esc(lead.id) + '" data-field="' + field + '"';
    if (field === 'stage') {
      return '<select' + attrs + '>' + M.STAGES.map(function (s) {
        return '<option value="' + s.key + '"' + (v === s.key ? ' selected' : '') + '>' + s.label + '</option>';
      }).join('') + '</select>';
    }
    if (opt && opt.date) {
      /* 存的是**相对偏移**，输入框要的是绝对日期 ⇒ 以今天为基准换算（产物因此永不失效） */
      var abs = (v == null || v === '') ? '' : (U.addDays(ST.today, Number(v)) || '');
      return '<input type="date"' + attrs + ' value="' + U.esc(abs) + '">';
    }
    if (opt && opt.txt) {
      return '<input' + attrs + ' data-t="1" value="' + U.esc(v == null ? '' : v) + '"'
        + (field === 'nextAction' ? ' placeholder="下一步做什么"' : ' placeholder="谁在跟"') + '>';
    }
    return '<input type="number"' + attrs + ' value="' + (v == null ? '' : v) + '" min="0"'
      + (field === 'mealPrice' ? ' step="0.5"' : ' step="1"') + '>';
  }

  function ctxOf() {
    return { leads: ST.leads, weights: M.weightsOf(ST.weights), today: ST.today };
  }

  /* ── 交互 ── */
  function onClick(e, t) {
    var act = t.getAttribute('data-act');
    if (!act) return;
    if (act === 'filt-overdue') { ST.filt.overdue = !ST.filt.overdue; render(); return; }
    if (act === 'filt-clear') {
      ST.filt = { stage: '', groupId: '', band: '', overdue: false, q: '' }; render(); return;
    }
    if (act === 'w-normalize') {
      var s = M.weightSum(ST.weights);
      if (s > 0) {
        var w = {};
        M.FACTORS.forEach(function (f) { w[f.key] = Math.round(ST.weights[f.key] / s * 1000) / 1000; });
        /* 四舍五入后可能差 0.001，补给权重最大的一项，保证和恰为 1 */
        var diff = Math.round((1 - M.weightSum(w)) * 1000) / 1000;
        if (diff !== 0) {
          var top = M.FACTORS.slice().sort(function (a, b) { return w[b.key] - w[a.key]; })[0];
          w[top.key] = Math.round((w[top.key] + diff) * 1000) / 1000;
        }
        ST.weights = w;
      }
      ST.msg = { ok: true, text: '权重已归一化到 1' };
      save(); render(); return;
    }
    if (act === 'w-reset') { ST.weights = defaultWeights(); ST.msg = { ok: true, text: '权重已恢复默认' }; save(); render(); return; }
    if (act === 'reset-all') { resetAll(); render(); return; }
    if (act === 'add') {
      var q = function (k) { var el = U.$('[data-param="' + k + '"]'); return el ? String(el.value || '').trim() : ''; };
      /* ⚠️ 空输入必须存 null（「还没调研」），**不能**兜底成 0（「已登记为 0」）——
         0 会让这个因子算「有数据」，新线索靠「同楼群协同」凑满 3 项就拿到一个假分数，
         而且它永远不会进「待调研」清单。缺调研 ≠ 数值为 0，这是两件事。 */
      var nz = function (k) { var s = q(k); if (s === '') return null; var v = Number(s); return isFinite(v) ? v : null; };
      var name = q('n-name');
      if (!name) { ST.msg = { ok: false, text: '楼名不能为空' }; render(); return; }
      var gid = Number(q('n-group')) || 1;
      var n = ST.leads.filter(function (l) { return l.src === 'manual'; }).length + 1;
      var id = 'C-' + String(n).padStart(2, '0');
      while (ST.leads.some(function (l) { return l.id === id; })) { n += 1; id = 'C-' + String(n).padStart(2, '0'); }
      ST.leads.push({
        id: id, src: 'manual', buildingId: null, name: name, address: q('n-addr') || '（待补）',
        city: '北京', district: '朝阳区', groupId: gid,
        population: nz('n-pop'), floors: nz('n-floors'),
        companies: nz('n-companies'), mealPrice: nz('n-price'),
        floorsEntered: 0, stage: 'lead', owner: '', nextAction: '', nextDueOffset: null,
        reached: null, loseReason: null, touches: [], note: '人工登记',
      });
      ST.msg = { ok: true, text: '已加入 ' + id + '「' + name + '」（进「线索」阶段，人物字段先留空）' };
      save(); render(); return;
    }
    if (act === 'dl-csv') {
      var head = ['id', '来源', '楼名', '地址', '楼群', '阶段', '潜力分', '分档', '缺调研项',
        '人数', '楼层数', '公司数', '周边餐饮均价', '已进楼层', '负责人', '下一步', '下一步到期',
        '最近接触', '停滞天', '放弃原因'];
      var lines = [head];
      M.ranked(ST.leads, ST.weights).forEach(function (x) {
        var l = x.lead, sc2 = x.score;
        var gname = (SPEC.buildingGroups.list.filter(function (y) { return y.id === l.groupId; })[0] || {}).name || '';
        var lt = M.lastTouch(l);
        var di = M.dueInfo(l, ST.today);
        lines.push([l.id, l.src === 'seed' ? '真源' : '人工', l.name, l.address, gname,
          M.STAGE[l.stage].label, sc2.value == null ? '' : sc2.value,
          sc2.band ? sc2.band.key : '', sc2.missing.join(' / '),
          l.population, l.floors, l.companies, l.mealPrice, l.floorsEntered,
          l.owner, l.nextAction, di ? di.due : '', lt ? M.touchDate(lt, ST.today) : '',
          M.staleDays(l, ST.today) == null ? '' : M.staleDays(l, ST.today), l.loseReason || '']);
      });
      U.download('ABox楼宇拓展线索表-' + ST.today + '.csv', '\ufeff' + U.toCSV(lines), 'text/csv');
      ST.msg = { ok: true, text: '已导出 ' + (lines.length - 1) + ' 条线索' }; render(); return;
    }
    if (act === 'dl-md') {
      var td = M.todos(ST.leads, ST.today);
      var out = ['# ABox 一盒 · 楼宇拓展跟进清单', '', '基准日 ' + ST.today + ' · 共 ' + td.length + ' 条', ''];
      var overdue = td.filter(function (x) { return x.due && x.due.overdue; });
      if (overdue.length) {
        out.push('## ⚠️ 已逾期 ' + overdue.length + ' 条', '');
        overdue.forEach(function (x) {
          out.push('- **' + x.lead.name + '**（' + M.STAGE[x.lead.stage].label + '）'
            + '—— 逾 ' + (-x.due.days) + ' 天 · ' + x.lead.owner + ' · ' + x.lead.nextAction);
        });
        out.push('');
      }
      out.push('## 全部待办（按到期日）', '');
      td.forEach(function (x) {
        var when = !x.due ? '未定' : (x.due.overdue ? '逾期 ' + (-x.due.days) + ' 天'
          : (x.due.isToday ? '今天' : x.due.days + ' 天后(' + x.due.due + ')'));
        out.push('- [' + when + '] **' + x.lead.name + '** · ' + M.STAGE[x.lead.stage].label
          + ' ｜ ' + x.lead.owner + ' ｜ ' + x.lead.nextAction
          + (x.stale == null ? '' : '（最近接触 ' + x.stale + ' 天前）'));
      });
      U.download('ABox楼宇拓展跟进清单-' + ST.today + '.md', out.join('\n'), 'text/markdown');
      ST.msg = { ok: true, text: '已导出跟进清单' }; render(); return;
    }
  }

  function onInput(e, t) {
    /* 权重（侧栏）—— 只重绘主区，侧栏输入框不动，焦点自然保留 */
    var wk = t.getAttribute('data-w');
    if (wk) {
      ST.weights[wk] = Number(t.value) || 0;
      save(); renderMain(); updateWSum(); return;
    }
    /* 侧栏筛选 —— 关键词框是文本输入，整栏重绘会打断输入 ⇒ 只刷主区 + 条数；
       下拉类控件没有输入焦点问题，整栏重绘（顺带把「N / M 条」刷新） */
    var pk = t.getAttribute('data-param');
    if (pk && pk.indexOf('n-') !== 0) {
      if (pk === 'q') ST.filt.q = t.value;
      else if (pk === 'stage') ST.filt.stage = t.value;
      else if (pk === 'groupId') ST.filt.groupId = t.value;
      else if (pk === 'band') ST.filt.band = t.value;
      save();
      if (pk === 'q') { renderMain(); updateCount(); } else { render(); }
      return;
    }
    /* 主区行内编辑 —— 重绘后按 (data-lead, data-field) 复原焦点 */
    var lid = t.getAttribute('data-lead'), f = t.getAttribute('data-field');
    if (!lid || !f) return;
    var l = ST.leads.filter(function (x) { return x.id === lid; })[0];
    if (!l) return;
    ST.focus = { lead: lid, field: f, pos: t.selectionStart == null ? 0 : t.selectionStart };
    if (f === 'stage') l.stage = t.value;
    else if (f === 'nextDueOffset') l.nextDueOffset = t.value ? U.diffDays(ST.today, t.value) : null;
    else if (f === 'owner' || f === 'nextAction') l[f] = t.value;
    else l[f] = t.value === '' ? null : Number(t.value);
    save(); renderMain();
  }

  function boot() {
    load();
    var v = U.$('#ver'); if (v) v.textContent = VERSION;
    var d = U.$('#date'); if (d) d.textContent = ST.today;
    U.on('click', '[data-act]', onClick);
    U.on('input', 'input, select', onInput);
    U.on('change', 'input, select', onInput);
    render();
    document.documentElement.setAttribute('data-tool-ready', '1');
  }

  M.CELL = cell;
  g.G1 = {
    state: function () { return ST; },
    leads: function () { return ST.leads; },
    filtered: rows, todos: todoRows, summary: sum, score: sc,
    ctx: ctxOf,
    selfcheck: function () { return SC.run(ctxOf()); },
    addLead: function (o) {
      ST.leads.push(Object.assign({
        id: 'T-' + (ST.leads.length + 1), src: 'manual', buildingId: null, city: '北京',
        district: '朝阳区', floorsEntered: 0, stage: 'lead', owner: '', nextAction: '',
        nextDueOffset: null, reached: null, loseReason: null, touches: [], note: '人工登记',
      }, o));
      renderMain(); return ST.leads[ST.leads.length - 1];
    },
    render: render, renderMain: renderMain,
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script></body></html>
