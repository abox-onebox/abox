<style>
/* ── token 真源（生成注入，禁手改）── */
:root{
  --bg: #F6F0E5;
  --surface: #FFFDF8;
  --surface2: #F7F1E4;
  --surface3: #FBF6EC;
  --text: #6E5435;
  --text2: #796C57;
  --text-disabled: #A79A85;
  --gold: #C9A876;
  --gold-deep: #936F3A;
  --gold-deepest: #8A6620;
  --border: #E4D8C3;
  --border-strong: #D6CBB8;
  --ok: #5B7C3A;
  --warn: #C44536;
  --info: #4A6FA5;
  --ok-bg: #F1F5EA;
  --ok-bd: #BBCBA6;
  --warn-bg: #FBF0EE;
  --warn-bd: #E3BFB8;
  --info-bg: #EDF1F8;
  --info-bd: #B4C4DA;
  --mut-bg: #F7F2E8;
  --mut-bd: #E4D8C3;
  --gold-bg: #FBF4E6;
  --gold-bd: #DCC79C;
  --ok-fg: #597939;
  --warn-fg: #C24436;
  --info-fg: #4A6FA5;
  --gold-fg: #8D6A38;
  --from: #FFF6E0;
  --to: #FFEED5;
  --brand-meituan: #FFD400;
  --brand-meituan-text: #000000;
  --brand-taobao: #FF6A00;
  --brand-taobao-text: #000000;
  --brand-jd: #E1251B;
  --brand-jd-text: #FFFFFF;
  --font-display: 'ABoxKai',KaiTi,STKaiti,楷体,'Noto Serif SC',serif;
  --font-body: -apple-system,BlinkMacSystemFont,'PingFang SC','HarmonyOS Sans SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;
  --font-num: 'SF Mono','Roboto Mono',Consolas,monospace;
  --r-sm: 4px;
  --r-md: 10px;
  --r-lg: 16px;
  --sp-1: 6px;
  --sp-2: 10px;
  --sp-3: 14px;
  --sp-4: 20px;
  --sp-5: 28px;
}
/* ── 共享外壳 ── */
/* ─────────────────────────────────────────────────────────────
   P0 工具集 · 共享页面外壳
   ⚠️ 本文件**零颜色字面量**：一切颜色只能来自 `:root` token（由生成器注入）。
      构建期断言这一条（搜不到 # / rgb( / hsl( ），否则品牌必然各写各的。
   ⚠️ 字体分层：楷体只用于**标题 / 品牌字 / 金额大字**，正文与表格用无衬线栈。
   ───────────────────────────────────────────────────────────── */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--gold-deep); }

/* ── 顶栏 ── */
.top {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.top .logo {
  font-family: var(--font-display);
  font-size: 19px; letter-spacing: .04em; color: var(--text);
}
.top .sub { font-size: 12px; color: var(--text2); }
.top .spacer { flex: 1; }
.top .ver { font-family: var(--font-num); font-size: 11px; color: var(--text-disabled); }

/* ── 页头 ── */
.hero { padding: var(--sp-4) var(--sp-4) 0; }
.hero h1 {
  font-family: var(--font-display); font-size: 25px; font-weight: 400;
  margin: 0 0 4px; letter-spacing: .02em;
}
.hero p { margin: 0; color: var(--text2); font-size: 13px; max-width: 78ch; }

/* ── 布局 ── */
.wrap {
  display: flex; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4) var(--sp-5);
  align-items: flex-start;
}
/* ⚠️ 侧栏必须**自己能滚**（`max-height` + `overflow-y: auto`），这不是装饰：
   `position: sticky` 的元素一旦高于视口可用高度，底部会被**钉住不动** ——
   滚动页面也带不上来（必须滚到**整页最底**才够得到，因为那时 sticky 才脱离钉住）。
   实测（1440×900 笔记本，最常见的办公尺寸）：6 个带侧栏的工具里有 5 个的
   「筛选 / 操作（导出 · 导入 · 重置）」整组够不到；G1/G2/F3 在 1080 下也够不到。
   附带好处：对 sticky 元素 `scrollIntoView` 是无效的（滚动页面它不动），
   给侧栏自己的滚动区之后，控件才可能被自动带进视野（自动化探针同理）。
   62px = `.top` 的实际高度（与 `top` 一致，改一处要一起改）。 */
.side {
  width: 310px; flex: 0 0 310px; position: sticky; top: 62px;
  max-height: calc(100vh - 62px - var(--sp-3));
  overflow-y: auto; overscroll-behavior: contain;
}
.main { flex: 1; min-width: 0; }

/* ── 卡片 ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-3);
}
.card > h2 {
  font-family: var(--font-display); font-size: 16px; font-weight: 400;
  margin: 0 0 var(--sp-2); letter-spacing: .02em;
  display: flex; align-items: center; gap: 8px;
}
.card > h2 .n { font-family: var(--font-num); font-size: 11px; color: var(--text-disabled); }
.hint { font-size: 12px; color: var(--text2); margin: 0 0 var(--sp-2); }

/* ── 表格 ── */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; font-weight: 500; color: var(--text2);
  font-size: 11.5px; letter-spacing: .04em;
  padding: 7px 9px; border-bottom: 1px solid var(--border-strong);
  white-space: nowrap; background: var(--surface2);
}
td { padding: 8px 9px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface3); }
td.num, th.num { text-align: right; font-family: var(--font-num); }
td.mono { font-family: var(--font-num); font-size: 12px; }
.big {
  font-family: var(--font-display); font-size: 22px; line-height: 1.2;
}

/* ── 徽标 ── */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 8px; border-radius: 999px;
  font-size: 11.5px; white-space: nowrap;
  border: 1px solid var(--mut-bd); background: var(--mut-bg); color: var(--text2);
}
.pill.ok { border-color: var(--ok-bd); background: var(--ok-bg); color: var(--ok-fg); }
.pill.warn { border-color: var(--warn-bd); background: var(--warn-bg); color: var(--warn-fg); }
.pill.info { border-color: var(--info-bd); background: var(--info-bg); color: var(--info-fg); }
.pill.gold { border-color: var(--gold-bd); background: var(--gold-bg); color: var(--gold-fg); }
.pill.dim { color: var(--text-disabled); }

/* ── 表单 ── */
label.f { display: block; margin-bottom: var(--sp-2); }
label.f > span {
  display: block; font-size: 11.5px; color: var(--text2);
  letter-spacing: .04em; margin-bottom: 3px;
}
input, select, textarea {
  width: 100%; padding: 6px 9px;
  background: var(--surface3); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--r-md);
  font-family: var(--font-body); font-size: 13px;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--gold); background: var(--surface);
}
input[type=number] { font-family: var(--font-num); }
.row2 { display: flex; gap: var(--sp-2); }
.row2 > * { flex: 1; min-width: 0; }

/* ── 按钮 ── */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 13px; border-radius: var(--r-md);
  border: 1px solid var(--border-strong); background: var(--surface);
  color: var(--text); font-size: 13px; cursor: pointer;
}
.btn:hover { background: var(--surface2); border-color: var(--gold); }
.btn.primary {
  background: var(--text); border-color: var(--text); color: var(--surface);
  font-weight: 500;
}
.btn.primary:hover { background: var(--gold-deep); border-color: var(--gold-deep); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text2); }
.btn.ghost:hover { background: var(--surface2); }
.btnbar { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin-bottom: var(--sp-2); }

/* ── 指标格 ── */
/* ⚠️ 阈值要按**实际可用宽度**定：侧栏 310px − 卡片左右 padding 40px = 270px，
       minmax 定 132px 时 2×132+10(gap)=274 > 270 ⇒ 永远只排 1 列（看着像没生效）。 */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(116px, 1fr)); gap: var(--sp-1); }
.kpi {
  background: var(--surface3); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 9px 11px;
}
.kpi .k { font-size: 11.5px; color: var(--text2); letter-spacing: .04em; }
.kpi .v { font-family: var(--font-display); font-size: 21px; line-height: 1.3; }
.kpi .u { font-size: 12px; color: var(--text2); font-family: var(--font-body); }
.kpi.warn { border-color: var(--warn-bd); background: var(--warn-bg); }
.kpi.ok { border-color: var(--ok-bd); background: var(--ok-bg); }

/* ── 提示条 ──
   ⚠️ 必须是**块级正常流**，绝不能写 `display: flex`：
      提示条文案里普遍有行内 <b> / <br> / <span class="mono">。容器一旦是 flex，
      这些行内片段就各自变成**独立的 flex 子项**，被挤成一条条窄列、每个子项还自己
      内部换行 —— 长文案整段会散开（G2 概览那两条实测就是 9 个子项排一行，字距被拉满、
      末行也被撑开）。**副作用迟发**：文案短、能挤进一行时看着完全正常（G1/M1 就是这样
      过关的），所以这个坑很晚才露头。
      原来是 flex + `gap: 8px`；块级子元素之间的留白改由下面两条规则承担。 */
.note {
  display: block;
  padding: 8px 11px; border-radius: var(--r-md);
  border: 1px solid var(--mut-bd); background: var(--mut-bg);
  font-size: 12.5px; color: var(--text2); margin-bottom: var(--sp-3);
}
.note.warn { border-color: var(--warn-bd); background: var(--warn-bg); color: var(--warn-fg); }
.note.ok { border-color: var(--ok-bd); background: var(--ok-bg); color: var(--ok-fg); }
.note.info { border-color: var(--info-bd); background: var(--info-bg); color: var(--info-fg); }
.note b { color: inherit; }
/* 块级子元素之间留白（替代原来的 flex gap: 8px）—— 行内元素不受影响 */
.note > div + div { margin-top: 6px; }
/* 药丸横排（原来靠 flex 的 gap 撑开，块级流下要自己给左边距） */
.note > .pill + .pill { margin-left: 4px; }

/* ── 分段控件（tab）── */
.seg { display: flex; gap: 2px; padding: 3px; background: var(--surface2); border-radius: var(--r-md); border: 1px solid var(--border); }
.seg button {
  border: 0; background: transparent; color: var(--text2);
  padding: 5px 13px; border-radius: var(--r-sm); cursor: pointer; font: inherit; font-size: 13px;
}
.seg button.on { background: var(--surface); color: var(--text); font-weight: 500; }

/* ── 条形图 ── */
.bar { height: 8px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--gold); }
.bar.warn > i { background: var(--warn); }
.bar.ok > i { background: var(--ok); }

/* ── 自检条 ── */
.gate {
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface3); padding: 8px 11px; font-size: 12.5px;
}
.gate .g { display: flex; gap: 7px; align-items: baseline; padding: 1px 0; }
.gate .g i { font-style: normal; font-family: var(--font-num); font-size: 11px; color: var(--text-disabled); flex: 0 0 auto; }
.gate .g .t { color: var(--text2); }
.gate .g.bad .t { color: var(--warn-fg); }

/* ── 页脚 ── */
.foot {
  padding: var(--sp-4); color: var(--text-disabled); font-size: 11.5px;
  border-top: 1px solid var(--border); margin-top: var(--sp-5);
}

/* ── 窄屏：单列堆叠（断点与项目后台一致，避免出现第二份断点表述）── */
@media (max-width: 768px) {
  .wrap { flex-direction: column; padding: var(--sp-2); }
  /* ⚠️ 落到单列后必须**解除**侧栏的自身滚动区：否则手机上会出现一个 1/4 屏高的小滚动盒，
        里面的卡片被裁掉一半 —— 那是「为修一个坑造一个新坑」。 */
  .side { width: 100%; flex: auto; position: static; max-height: none; overflow-y: visible; }
  .hero { padding: var(--sp-3) var(--sp-2) 0; }
  table { font-size: 12px; }
}

/* ── 本系统 ── */
/* ─────────────────────────────────────────────────────────────
   M2 现金流与账期预测 · 专属样式

   ⚠️ 零颜色字面量：一切颜色只能来自 `:root` token（由生成器注入）。
      构建期会断言这一条（注释与 :root 块已由判据剔除）。
   ⚠️ 不写 `@media`：断点唯一真源是共享外壳的 768px（项目纪律）。
   ───────────────────────────────────────────────────────────── */

/* ── 结论区：可支撑天数大字 ── */
.runway {
  display: flex; align-items: baseline; gap: 10px;
  padding: var(--sp-2) 0;
}
.runway .v { font-family: var(--font-display); font-size: 42px; line-height: 1.1; }
.runway .u { font-size: 14px; color: var(--text2); }
.runway .tag { font-size: 12px; }

/* ── 现金流条形（以 0 为轴，正向右、负向左）──
   ⚠️ 与共享 `.bar > i` 同款纪律：内层必须 `display:block`，否则 height 不生效。 */
.cfbar {
  position: relative; height: 22px; margin: 3px 0 9px;
  background: var(--surface2); border-radius: var(--r-sm);
  overflow: hidden;
}
.cfbar .axis {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: var(--border-strong);
}
.cfbar .fill { position: absolute; top: 3px; bottom: 3px; border-radius: 2px; }
.cfbar .fill.in { background: var(--ok); }
.cfbar .fill.out { background: var(--warn); }
.cfbar .lb {
  position: absolute; top: 2px; font-family: var(--font-num);
  font-size: 11px; color: var(--text2); white-space: nowrap;
}

/* ── 现金流曲线 ── */
.curve { width: 100%; height: 190px; display: block; }
.curve .grid { stroke: var(--border); stroke-width: 1; }
.curve .zero { stroke: var(--border-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.curve .ln { fill: none; stroke: var(--gold-deep); stroke-width: 2; }
.curve .ar { fill: var(--gold-bg); opacity: .55; }
.curve .dot { fill: var(--gold-deep); }
.curve .tx { fill: var(--text2); font-size: 10px; font-family: var(--font-num); }

/* ── 砍楼模拟 ── */
.cutlist { max-height: 320px; overflow-y: auto; }
.cutlist label.cut {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 6px; border-radius: var(--r-sm); cursor: pointer;
}
.cutlist label.cut:hover { background: var(--surface3); }
.cutlist label.cut input[type=checkbox] { width: auto; flex: 0 0 auto; }
.cutlist label.cut .nm { flex: 1; min-width: 0; font-size: 12.5px; }
.cutlist label.cut .qt { font-family: var(--font-num); font-size: 12px; color: var(--text2); }
.cutlist label.cut.off .nm { color: var(--text-disabled); text-decoration: line-through; }

/* ── 单份经济拆解条 ── */
.stack { display: flex; height: 30px; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--border); }
.stack > i {
  display: block; height: 100%;
  font-style: normal; font-size: 10.5px; font-family: var(--font-num);
  color: var(--surface); text-align: center; line-height: 30px;
  overflow: hidden; white-space: nowrap;
}
.stack > i.s-purchase { background: var(--warn); }
.stack > i.s-comm { background: var(--gold); }
.stack > i.s-fulfill { background: var(--info); }
.stack > i.s-gain { background: var(--ok); }
.stack > i.s-lost { background: var(--text-disabled); }

/* ── 表内小字与对齐 ── */
td .sub2 { display: block; font-size: 11px; color: var(--text2); font-family: var(--font-body); }
tr.tot td { font-weight: 500; background: var(--surface2); }
tr.neg td.num { color: var(--warn-fg); }
tr.pos td.num { color: var(--ok-fg); }

/* ── 待办条 ── */
.todo { margin: 0 0 var(--sp-2); padding-left: 18px; font-size: 12.5px; color: var(--text2); }
.todo li { margin-bottom: 4px; }

    if (res.todos.length) {
      h += '<ul class="todo" style="margin-top:10px">';
      res.todos.forEach(function (t) { h += '<li>' + U.esc(t) + '</li>'; });
      h += '</ul>';
    }
    h += '</div>';
    return h;
  }

  /* ── 渲染 ─────────────────────────────────────────────────────────── */
  function render() {
    var res = window.SelfCheck.run(S, st);
    U.$('#main').innerHTML = renderVerdict(res) + renderUnit(res) + renderDaily(res)
      + renderRoll(res) + renderCut() + renderRhythm() + renderGate(res);
    return res;
  }

  function exportCsv() {
    var res = window.SelfCheck.run(S, st);
    var rows = [['项', '元/天', '口径']];
    var d = res.daily;
    rows.push(['用户预付', d.grossIn, '下单即付']);
    rows.push(['退款流出', d.refundOut, '退款率 ' + d.refundRate]);
    rows.push(['供应商采购款', d.purchaseOut, '按全部份数，退款不冲减']);
    rows.push(['团长佣金', d.commOut, '按净份数']);
    rows.push(['履约成本', d.fulfillOut, '场所+打包+配送']);
    rows.push(['固定成本', d.fixedDaily, '按 30 天摊']);
    rows.push(['日均净现金流', d.netDaily, '']);
    rows.push([]);
    rows.push(['第N天', '流入', '流出', '净', '余额']);
    res.roll.forEach(function (x) { rows.push([x.day, x.in, x.out, x.net, x.balance]); });
    U.download('ABox现金流推演_' + U.today() + '.csv', U.toCSV(rows), 'text/csv');
  }

  /* ── 事件 ─────────────────────────────────────────────────────────── */
  function bind() {
    U.on('input', 'input[data-k]', function (e, t) {
      st = M.set(st, t.getAttribute('data-k'), t.value);
      render();
    });
    U.on('input', 'input[data-lv]', function (e, t) {
      var mix = Object.assign({}, st.levelMix);
      mix[t.getAttribute('data-lv')] = Number(t.value);
      st.levelMix = mix;
      render();
    });
    U.on('change', 'input[data-cut]', function (e, t) {
      var id = Number(t.getAttribute('data-cut'));
      var i = cutIds.indexOf(id);
      if (t.checked && i < 0) cutIds.push(id);
      if (!t.checked && i >= 0) cutIds.splice(i, 1);
      render();
    });
    U.on('click', '[data-act]', function (e, t) {
      var a = t.getAttribute('data-act');
      if (a === 'reset') { st = M.defaults(); cutIds = []; renderSide(); render(); }
      if (a === 'csv') exportCsv();
    });
  }

  function boot() {
    U.$('#ver').textContent = window.TOOL_VERSION;
    U.$('#date').textContent = U.today();
    renderSide();
    render();
    bind();
    /* ⚠️ 必须挂在 `<html>` 上，不是 `<body>`：探针断言的是
       `page.getAttribute('html', 'data-tool-ready')`，挂错地方探针恒红（本轮实测踩到）。 */
    document.documentElement.setAttribute('data-tool-ready', '1');
  }

  /* ── 导出给探针（构建期自检与真 Chrome 共用同一份实现）────────────── */
  window.M2App = {
    boot: boot,
    state: function () { return st; },
    setState: function (k, v) { st = M.set(st, k, v); render(); return st; },
    cuts: function () { return cutIds.slice(); },
    setCuts: function (ids) { cutIds = (ids || []).slice(); render(); return cutIds; },
    render: render,
    check: function () { return window.SelfCheck.run(S, st); }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script></body></html>
