<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ABox 一盒">
<meta name="theme-color" content="#F6F0E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="ABox 一盒 · 办公楼白领盒饭团购小程序原型 v4.10.0 · 37 页 MVP · 结算成本项可配置版">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<title>ABox 一盒 · 原型 v4.10.0 · 37 页 MVP · 结算成本项可配置版</title>
<style>
  :root {
    --bg-cream: #F6F0E5;
    --bg-cream-light: #FBF7EE;
    --bg-cream-dark: #EFE5D0;
    --text-brown: #6E5435;
    --text-brown-light: #8B7355;
    --accent-gold: #C9A876;
    --accent-gold-dark: #B8915C;
    --border-brown: #D4C4A8;
    --success: #5B7C3A;
    --warning: #C44536;
    --info: #4A6FA5;
    --shadow: 0 1px 2px rgba(110, 84, 53, 0.06), 0 4px 12px rgba(110, 84, 53, 0.07);
    --shadow-lg: 0 2px 6px rgba(110, 84, 53, 0.08), 0 12px 32px rgba(110, 84, 53, 0.14);
    --font-kai: "KaiTi", "STKaiti", "楷体", "Kaiti SC", serif;
    /* ==== v4.9 视觉规范 tokens（渐进精修，向后兼容） ==== */
    --radius-sm: 10px; --radius-md: 14px; --radius-lg: 18px; --radius-pill: 24px;
    --sp-1: 6px; --sp-2: 10px; --sp-3: 14px; --sp-4: 20px; --sp-5: 28px;
    --fs-xs: 11px; --fs-sm: 12px; --fs-body: 13.5px; --fs-md: 14px; --fs-title: 15.5px; --fs-h2: 17px; --fs-h1: 20px;
    --border-soft: #E6D9C0;
    --hover-tint: rgba(201, 168, 118, 0.14);
    --focus-ring: 0 0 0 3px rgba(201, 168, 118, 0.35);
    --ease: cubic-bezier(0.33, 1, 0.68, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: var(--font-kai);
    background: #2A2118;
    min-height: 100vh;
    color: var(--text-brown);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* v4.9：品牌化滚动条 / 选区 / 焦点环（桌面端细节质感） */
  ::selection { background: rgba(201, 168, 118, 0.35); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(201, 168, 118, 0.45); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold-dark); }
  :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ========== 顶部角色导航 ========== */
  .top-nav {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(20, 16, 12, 0.95);
    backdrop-filter: blur(8px);
    padding: 12px 16px 10px;
    z-index: 999;
    border-bottom: 1px solid rgba(212, 164, 116, 0.2);
  }
  .top-nav-title {
    color: var(--accent-gold);
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 10px;
    text-align: center;
    letter-spacing: 2px;
  }
  .role-tabs {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .role-tab {
    padding: 6px 14px;
    border-radius: 16px;
    background: rgba(110, 84, 53, 0.3);
    color: #D4C4A8;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
    user-select: none;
  }
  .role-tab:hover { background: rgba(110, 84, 53, 0.5); }
  .role-tab.active {
    background: var(--accent-gold);
    color: #2A2118;
    border-color: var(--accent-gold-dark);
    font-weight: bold;
  }

  /* ========== 页面工具栏（页面名 + 索引） ========== */
  .page-toolbar {
    position: fixed;
    top: 75px; left: 0; right: 0;
    background: rgba(30, 24, 18, 0.9);
    backdrop-filter: blur(8px);
    z-index: 998;
    border-bottom: 1px solid rgba(212, 164, 116, 0.1);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .page-breadcrumb {
    color: var(--accent-gold);
    font-size: 13px;
    flex-shrink: 0;
  }
  .page-index-select {
    background: rgba(110, 84, 53, 0.4);
    color: #FBF7EE;
    border: 1px solid rgba(212, 164, 116, 0.3);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-family: var(--font-kai);
    cursor: pointer;
    outline: none;
    max-width: 240px;
    flex-shrink: 0;
  }
  .page-nav-buttons {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .page-nav-btn {
    background: rgba(110, 84, 53, 0.4);
    color: #FBF7EE;
    border: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .page-nav-btn:hover {
    background: var(--accent-gold);
    color: #2A2118;
  }
  .page-nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ========== 页面容器 ========== */
  .pages-stage {
    padding-top: 130px;
    padding-bottom: 60px;
    min-height: 100vh;
  }
  .page {
    display: none;
    animation: fadeIn 0.25s ease;
  }
  .page.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .stage-flex {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
  }

  /* ========== 手机模型 ========== */
  .phone-shell {
    width: 375px;
    max-width: 100%;
    background: var(--bg-cream);
    border-radius: 24px;
    box-shadow: var(--shadow-lg), 0 0 0 2px rgba(201, 168, 118, 0.3);
    overflow: hidden;
    position: relative;
  }

  /* 后台页 - 桌面模式 */
  .desktop-shell {
    width: 1100px;
    max-width: 100%;
    background: var(--bg-cream);
    border-radius: 16px;
    box-shadow: var(--shadow-lg), 0 0 0 2px rgba(201, 168, 118, 0.3);
    overflow: hidden;
  }

  /* ========== 手机真机模式（v4.7.6 手机体验优化） ========== */
  /* 真机模式下：去掉手机壳边距/阴影/圆角，填满整个视口 */
  body.real-mobile .stage-flex { padding: 0; }
  body.real-mobile .page { margin: 0; }
  body.real-mobile .phone-shell {
    width: 100%;
    max-width: 100%;
    border-radius: 0;
    box-shadow: none;
  }
  body.real-mobile .desktop-shell {
    width: 100%;
    max-width: 100%;
    border-radius: 0;
    box-shadow: none;
  }
  /* 真机模式下：隐藏演示工具栏（顶部导航 + 页面索引 + 左右键按钮） */
  body.real-mobile .top-nav,
  body.real-mobile .page-toolbar,
  body.real-mobile .keyboard-hint,
  body.real-mobile .floating-controls {
    display: none !important;
  }
  /* 真机模式下：顶部加简易 tab（仅角色切换） */
  body.real-mobile .mobile-mini-nav {
    display: flex !important;
  }
  .mobile-mini-nav {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(20, 16, 12, 0.95);
    backdrop-filter: blur(8px);
    /* v4.7.7：iPhone 刘海屏安全区 */
    padding: calc(8px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) 8px calc(12px + env(safe-area-inset-left, 0px));
    z-index: 999;
    border-bottom: 1px solid rgba(212, 164, 116, 0.2);
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .mobile-mini-nav-item {
    padding: 5px 10px;
    border-radius: 12px;
    background: rgba(110, 84, 53, 0.3);
    color: #D4C4A8;
    font-size: 11px;
    white-space: nowrap;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .mobile-mini-nav-item.active {
    background: var(--accent-gold);
    color: #2A2118;
  }
  /* 真机模式下：所有 page 顶部预留 mini-nav 空间（含刘海） */
  body.real-mobile .page { padding-top: calc(44px + env(safe-area-inset-top, 0px)); }
  /* v4.7.7：真机模式底部 tabBar 加安全区（iPhone 底部小白条） */
  body.real-mobile .tab-bar {
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important;
  }
  /* v4.7.7：standalone 模式（添加到主屏幕）下，全屏填满 */
  @media (display-mode: standalone) {
    body { overscroll-behavior: none; }
    .mobile-mini-nav {
      display: flex !important;
      padding-top: calc(8px + env(safe-area-inset-top, 0px));
    }
    .top-nav, .page-toolbar, .keyboard-hint, .floating-controls { display: none !important; }
    .stage-flex { padding: 0 !important; }
    .page { margin: 0 !important; padding-top: calc(44px + env(safe-area-inset-top, 0px)) !important; }
    .phone-shell, .desktop-shell {
      width: 100% !important; max-width: 100% !important;
      border-radius: 0 !important; box-shadow: none !important;
    }
    .tab-bar { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important; }
  }

  /* ========== 通用响应式（无论模式都生效） ========== */
  @media (max-width: 500px) {
    .stage-flex { padding: 8px; }
    .top-nav { padding: 8px 10px 6px; }
    .top-nav-title { font-size: 13px; margin-bottom: 6px; }
    .role-tab { padding: 5px 10px; font-size: 12px; }
    .page-index-select { font-size: 11px; max-width: 160px; }
    .modal { max-width: 96vw; }
  }
  @media (max-width: 400px) {
    .stage-flex { padding: 4px; }
  }

  /* ========== 通用组件 ========== */
  .status-bar {
    height: 28px;
    background: rgba(110, 84, 53, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--text-brown-light);
    letter-spacing: 1px;
  }
  .nav-bar {
    height: 44px;
    background: var(--bg-cream);
    border-bottom: 1px solid var(--border-brown);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-weight: bold;
  }
  .nav-back {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    color: var(--text-brown);
    padding: 4px 8px;
    user-select: none;
  }
  .nav-back:hover { opacity: 0.6; }

  .content {
    min-height: 600px;
    padding-bottom: 80px;
  }

  .card {
    background: var(--bg-cream-light);
    border-radius: var(--radius-md);
    padding: 16px;
    box-shadow: var(--shadow);
    margin: 12px 14px;
    border: 1px solid var(--border-soft);
    transition: box-shadow 0.2s var(--ease);
  }
  .card-title {
    font-weight: bold;
    margin-bottom: 10px;
    font-size: var(--fs-title);
    letter-spacing: 0.5px;
    color: var(--text-brown);
  }

  .dish-row {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px dashed var(--border-brown);
    gap: 12px;
  }
  .dish-row:last-child { border-bottom: none; }
  .dish-emoji {
    width: 56px; height: 56px;
    background: var(--bg-cream-dark);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    flex-shrink: 0;
  }
  .dish-info { flex: 1; }
  .dish-name {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .dish-supplier {
    font-size: 12px;
    color: var(--text-brown-light);
  }
  .dish-supplier-tag {
    display: inline-block;
    background: var(--accent-gold);
    color: white;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
    margin-right: 4px;
  }

  .price-big {
    font-size: 30px;
    color: var(--text-brown);
    font-weight: bold;
    letter-spacing: 0.5px;
    line-height: 1.2;
  }
  .price-big .unit { font-size: 14px; color: var(--text-brown-light); letter-spacing: 0; }

  .btn-primary {
    width: calc(100% - 28px);
    display: block;
    margin: 14px;
    background: linear-gradient(135deg, var(--text-brown) 0%, var(--accent-gold-dark) 100%);
    color: var(--bg-cream);
    padding: 14px;
    border-radius: var(--radius-pill);
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    border: none;
    font-family: var(--font-kai);
    user-select: none;
    box-shadow: 0 4px 12px rgba(110, 84, 53, 0.25);
    transition: transform 0.15s var(--ease), box-shadow 0.2s var(--ease), filter 0.2s;
  }
  .btn-primary:hover { filter: brightness(1.08); box-shadow: 0 6px 18px rgba(110, 84, 53, 0.32); }
  .btn-primary:active { transform: scale(0.98); box-shadow: 0 2px 6px rgba(110, 84, 53, 0.2); }
  .btn-secondary {
    width: calc(100% - 28px);
    display: block;
    margin: 14px;
    background: var(--bg-cream);
    color: var(--text-brown);
    padding: 12px;
    border-radius: var(--radius-pill);
    text-align: center;
    font-size: 15px;
    letter-spacing: 1px;
    cursor: pointer;
    border: 1px solid var(--border-brown);
    font-family: var(--font-kai);
    user-select: none;
    transition: background 0.15s, transform 0.15s var(--ease);
  }
  .btn-secondary:hover { background: var(--bg-cream-dark); }
  .btn-secondary:active { transform: scale(0.98); }

  .qty-control {
    display: inline-flex;
    align-items: center;
    background: var(--bg-cream);
    border: 1px solid var(--border-brown);
    border-radius: 18px;
    overflow: hidden;
  }
  .qty-btn {
    width: 30px; height: 30px;
    background: var(--bg-cream-dark);
    border: none;
    color: var(--text-brown);
    font-size: 18px;
    cursor: pointer;
    font-family: var(--font-kai);
  }
  .qty-btn:hover { background: var(--accent-gold); color: white; }
  .qty-value {
    width: 36px;
    text-align: center;
    font-weight: bold;
  }

  .countdown {
    background: var(--text-brown);
    color: var(--bg-cream);
    padding: 12px 14px;
    border-radius: 0 0 18px 18px;
    text-align: center;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .countdown-num {
    font-size: 18px;
    font-weight: bold;
    color: var(--accent-gold);
    letter-spacing: 1px;
    font-family: monospace;
  }

  .timeline {
    position: relative;
    padding: 14px 0 14px 24px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 22px; bottom: 22px;
    width: 2px;
    background: var(--border-brown);
  }
  .tl-item {
    position: relative;
    padding: 8px 0 16px;
    font-size: 13px;
  }
  .tl-item::before {
    content: '';
    position: absolute;
    left: -22px; top: 14px;
    width: 12px; height: 12px;
    background: var(--bg-cream);
    border: 2px solid var(--border-brown);
    border-radius: 50%;
    z-index: 1;
  }
  .tl-item.done::before {
    background: var(--accent-gold);
    border-color: var(--accent-gold);
  }
  .tl-item.active::before {
    background: var(--accent-gold);
    border-color: var(--accent-gold);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201, 168, 118, 0.6); }
    50%      { box-shadow: 0 0 0 6px rgba(201, 168, 118, 0); }
  }
  .tl-title { font-weight: bold; }
  .tl-time { color: var(--text-brown-light); font-size: 12px; }

  /* ========== 后台外壳（v4.8 标准后台范式：TopBar + Sidebar + Content） ========== */
  .admin-shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background: var(--bg-cream-light);
    border-radius: 12px;
    overflow: hidden;
    position: relative;          /* 让绝对定位的抽屉/遮罩以本容器为参照 */
  }
  /* TopBar */
  .admin-topbar {
    display: flex;
    align-items: center;
    height: 56px;
    background: var(--bg-cream);
    border-bottom: 1px solid var(--border-brown);
    padding: 0 18px;
    flex-shrink: 0;
    gap: 14px;
  }
  .admin-topbar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    font-size: 16px;
    color: var(--text-brown);
  }
  .admin-topbar-logo .logo-mark {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-dark));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
    font-weight: bold;
  }
  .admin-topbar-logo .role-badge {
    background: rgba(201, 168, 118, 0.15);
    color: var(--accent-gold-dark);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 4px;
  }
  /* 面包屑 */
  .admin-topbar-crumb {
    flex: 1;
    font-size: 13px;
    color: var(--text-brown-light);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .admin-topbar-crumb .sep { color: var(--border-brown); margin: 0 6px; }
  .admin-topbar-crumb .cur { color: var(--text-brown); font-weight: bold; }
  /* 顶部右侧操作 */
  .admin-topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .admin-icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--bg-cream-dark);
    color: var(--text-brown);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    position: relative;
    user-select: none;
  }
  .admin-icon-btn:hover { background: rgba(201, 168, 118, 0.25); }
  .admin-icon-btn .badge {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 8px;
    height: 8px;
    background: #C44536;
    border-radius: 50%;
  }
  .admin-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-dark));
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    font-weight: bold;
    user-select: none;
  }
  .admin-avatar:hover { box-shadow: 0 0 0 2px rgba(201, 168, 118, 0.4); }
  /* 主体：Sidebar + Content */
  .admin-body {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .admin-sidebar {
    width: 220px;
    background: var(--bg-cream);
    border-right: 1px solid var(--border-brown);
    overflow-y: auto;
    padding: 12px 0;
    flex-shrink: 0;
  }
  .admin-sidebar-group {
    padding: 0 12px 8px;
  }
  .admin-sidebar-group-title {
    font-size: 11px;
    color: var(--text-brown-light);
    padding: 10px 12px 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .admin-sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    margin: 2px 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-brown);
    user-select: none;
    transition: all 0.15s;
  }
  .admin-sidebar-item .icon {
    width: 22px;
    text-align: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .admin-sidebar-item:hover { background: rgba(201, 168, 118, 0.18); }
  .admin-sidebar-item.active {
    background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-dark));
    color: white;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(184, 145, 92, 0.35);

let isMobileMode = false;

  isMobileMode = !isMobileMode;

  document.getElementById('mobileModeToggle').textContent = isMobileMode ? '🖥️ 切回演示模式' : '📱 切换真机模式';

function setMobileRole(role) {
  currentRole = role;

  // 切到该角色首页
  if (role === 'all') {
    switchPage(0);
  } else {
    const first = PAGES.findIndex(p => p.role === role);
    if (first >= 0) switchPage(first);
  }

function syncMobileRoleActive() {
  document.querySelectorAll('#mobileMiniNav .mobile-mini-nav-item[data-role]').forEach(el => {
    el.classList.toggle('active', el.dataset.role === currentRole);
  });

function init() {
  const sel = document.getElementById('pageIndexSelect');
  PAGES.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = `${p.id} · ${p.title}`;
    sel.appendChild(opt);
  });
  buildStage();
  renderAll();
  switchPage(0);

  document.getElementById('roleTabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.role-tab');
    if (!tab) return;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    // 切角色 = 清栈后跳角色首页
    switchRoleFn(tab.dataset.role);
    syncMobileRoleActive();
  });

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    // ← 返回上一页；→ 下一个页面（无栈，按 PAGES 顺序）
    if (e.key === 'ArrowLeft')  navigateBack();
    if (e.key === 'ArrowRight') goNext();
  });

  // 浏览器后退键 → 走导航栈
  window.addEventListener('popstate', (e) => {
    if (navHistory.length > 0) {
      navigateBack();
    }
  });

  // 真机模式下：原生手势左右滑动切换页面
  let touchStartX = 0;
  let touchStartY = 0;
  window.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive: true});
  window.addEventListener('touchend', (e) => {
    if (!isMobileMode) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
    if (Math.abs(dx) > 60 && dy < 40) {  // 横向滑动足够且非竖向滚动
      if (dx < 0) goNext();
      else goPrev();
    }
  }, {passive: true});
}

function buildStage() {
  const stage = document.getElementById('pagesStage');
  const frag = document.createDocumentFragment();
  PAGES.forEach((p, i) => {
    const sec = document.createElement('section');
    sec.className = 'page';
    sec.id = `page-${p.id}`;
    sec.dataset.pageIndex = i;
    sec.dataset.role = p.role;
    const flex = document.createElement('div');
    flex.className = 'stage-flex';
    const shell = document.createElement('div');
    shell.className = (p.role === 'admin') ? 'desktop-shell' : 'phone-shell';
    flex.appendChild(shell);
    sec.appendChild(flex);
    frag.appendChild(sec);
  });
  stage.appendChild(frag);
}

function renderAll() {
  PAGES.forEach(p => {
    const sec = document.getElementById(`page-${p.id}`);
    const shell = sec.querySelector('.phone-shell, .desktop-shell');
    shell.innerHTML = p.render();
  });
}

// ============ 导航历史栈（v4.7.7 重构）============
const navHistory = [];    // [{pageId, scrollY, role}]
const MAX_NAV = 30;
let _navBackInProgress = false;  // navigateBack 调用时跳过压栈
let _suppressPush = false;        // switchTab / switchRoleFn 调用时跳过压栈

// 弹栈返回
function navigateBack() {
  if (navHistory.length === 0) {
    // 退无可退 → 角色首页
    if (currentRole === 'all') {
      switchPageNoPush(0);
    } else {
      const first = PAGES.findIndex(p => p.role === currentRole);
      if (first >= 0) switchPageNoPush(first);
    }
    return;
  }
  const prev = navHistory.pop();
  const idx = PAGES.findIndex(p => p.id === prev.pageId);
  if (idx < 0) return;
  // 跨角色返回时同步角色
  if (prev.role && prev.role !== currentRole) currentRole = prev.role;
  _navBackInProgress = true;
  switchPage(idx);
  if (prev.scrollY && PAGES[idx].role === prev.role) {
    requestAnimationFrame(() => window.scrollTo(0, prev.scrollY));
  }
  _navBackInProgress = false;
}

// 不入栈切换（供 tabBar / 角色切换 / 栈空兜底）
function switchPageNoPush(index) {
  _suppressPush = true;
  switchPage(index);
  _suppressPush = false;
}

// tabBar 切换（清栈）
function switchTab(pageId) {
  const idx = PAGES.findIndex(p => p.id === pageId);
  if (idx < 0) return;
  navHistory.length = 0;
  if (PAGES[idx].role !== currentRole) currentRole = PAGES[idx].role;
  switchPageNoPush(idx);
}

// 顶部角色 tab 切换（清栈）
function switchRoleFn(role) {
  navHistory.length = 0;
  currentRole = role;   // 必须先更新角色，否则 switchPage 的角色过滤会打回原角色首页
  if (role === 'all') {
    switchPageNoPush(0);
  } else {
    const first = PAGES.findIndex(p => p.role === role);
    if (first >= 0) switchPageNoPush(first);
  }
}

function switchPage(index) {
  if (index < 0 || index >= PAGES.length) return;
  // 自动入栈（navigateBack / switchTab / switchRoleFn 调用时跳过）
  if (!_navBackInProgress && !_suppressPush && currentPageIndex !== index && currentPageIndex >= 0) {
    if (PAGES[currentPageIndex].id !== PAGES[index].id) {
      navHistory.push({
        pageId: PAGES[currentPageIndex].id,
        scrollY: window.scrollY,
        role: PAGES[currentPageIndex].role,
      });
      while (navHistory.length > MAX_NAV) navHistory.shift();
    }
  }

  // 过滤：当前角色可见页
  let visibleIndex = index;
  if (currentRole !== 'all') {
    // 如果目标页不是当前角色，跳到该角色首页
    if (PAGES[index].role !== currentRole) {
      const first = PAGES.findIndex(p => p.role === currentRole);
      if (first < 0) return;
      visibleIndex = first;
    }
  }

  document.querySelectorAll('.page').forEach(s => s.classList.remove('active'));
  const sec = document.getElementById(`page-${PAGES[visibleIndex].id}`);
  sec.classList.add('active');
  document.getElementById('breadcrumb').textContent =
    `${PAGES[visibleIndex].id} · ${PAGES[visibleIndex].title} · ${PAGES[visibleIndex].breadcrumb}`;
  document.getElementById('pageIndexSelect').value = PAGES[visibleIndex].id;
  currentPageIndex = visibleIndex;

  // 同步角色 tab
  const role = PAGES[visibleIndex].role;
  document.querySelectorAll('.role-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.role === role);
  });
  currentRole = role;

  // 顶部滚动
  window.scrollTo({top: 0, behavior: 'instant'});

  // 上下页按钮禁用（v4.7.7：prev 改为返回栈，仅在无栈且处于角色首页时禁用）
  const isRoleHome = (currentRole === 'all')
    ? (visibleIndex === 0)
    : (visibleIndex === PAGES.findIndex(p => p.role === currentRole));
  document.getElementById('prevBtn').disabled = (navHistory.length === 0 && isRoleHome);
  document.getElementById('nextBtn').disabled = (visibleIndex >= PAGES.length - 1);

  // 启动需要刷新的组件（倒计时/计时器）
  afterSwitch(visibleIndex);
}

function afterSwitch(idx) {
  // 倒计时：重新计算
  if (PAGES[idx].id === 'P1' || PAGES[idx].id === 'P3' || PAGES[idx].id === 'P5' || PAGES[idx].id === 'P11') {
    startCountdown();
  }
  // 手机端后台：把当前高亮的横向导航项滚到可视区中间
  if (typeof scrollAdminNavIntoView === 'function') {
    requestAnimationFrame(scrollAdminNavIntoView);
  }
}

function goToPage(id) {
  const idx = PAGES.findIndex(p => p.id === id);
  if (idx < 0) return;
  // v4.7.7：若目标页已在栈中 → 回退到该位置（弹掉其后的记录），避免"返回首页后又返回详情"的怪链路
  const stackPos = navHistory.map(h => h.pageId).lastIndexOf(id);
  if (stackPos >= 0) {
    navHistory.length = stackPos;
    _navBackInProgress = true;   // 抑制自动入栈
    switchPage(idx);
    _navBackInProgress = false;
    return;
  }
  switchPage(idx);
}
// goPrev 语义 = 返回上一页（保留别名，兼容旧调用）
function goPrev() {
  navigateBack();
}
function goNext() {
  if (currentPageIndex < PAGES.length - 1) switchPage(currentPageIndex + 1);
}

// ============ Modal 弹窗 ============
let modalExtra = null;
function showModal(opts) {
  const ov = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent = opts.title || '提示';
  document.getElementById('modalBody').innerHTML = opts.body || '';
  const actions = document.getElementById('modalActions');
  if (opts.actions && opts.actions.length) {
    actions.style.display = '';
    actions.innerHTML = opts.actions.map((a, i) =>
      `<button class="${a.primary?'btn-primary':'btn-secondary'}" style="margin:0;" onclick="modalAction(${i})">${a.label}</button>`
    ).join('');
    modalExtra = opts.actions;
  } else {
    actions.style.display = 'none';
    modalExtra = null;
  }
  ov.classList.add('show');
}
function modalAction(i) {
  const a = modalExtra[i];
  if (a && a.onclick) a.onclick();
  closeModal();
}
function closeModal(ev) {
  if (ev && ev.target !== ev.currentTarget) return;
  document.getElementById('modalOverlay').classList.remove('show');
  modalExtra = null;
}

// ============ 通用：countdown 到 T-1 24:00 ============
let countdownTimer = null;
function startCountdown() {
  if (countdownTimer) return;
  function tick() {
    const now = new Date();
    // 截单 = 明天 00:00（即用户视角的次日 24:00）
    const cutoff = new Date(now);
    cutoff.setHours(24, 0, 0, 0); // 今晚 24:00
    let diff = cutoff - now;
    if (diff < 0) {
      // 若已过截单，按"明日 24:00"
      cutoff.setHours(cutoff.getHours() + 24);
      diff = cutoff - now;
    }
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const pad = (n) => String(n).padStart(2, '0');
    document.querySelectorAll('.countdown-num').forEach(el => {
      el.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    });
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

// 倒计时文本（渲染时即返回真实值，避免出现静态 "--:--:--"）
function countdownText() {
  const now = new Date();
  const cutoff = new Date(now);
  cutoff.setHours(24, 0, 0, 0); // 今晚 24:00
  let diff = cutoff - now;
  if (diff < 0) {
    cutoff.setHours(cutoff.getHours() + 24);
    diff = cutoff - now;
  }
  const pad = (n) => String(n).padStart(2, '0');
  return `${pad(Math.floor(diff / 3600000))}:${pad(Math.floor((diff % 3600000) / 60000))}:${pad(Math.floor((diff % 60000) / 1000))}`;
}

  if (sec) {
    // 保留外层手机壳/桌面壳包裹，只替换其内部内容
    const shell = sec.querySelector('.phone-shell, .desktop-shell');
    if (shell) shell.innerHTML = cur.render();

  }
  afterSwitch(currentPageIndex);
}

// ============ P27 后台: 套餐矩阵 ============
function renderP27() {
  const dates = ['9/13 周日','9/14 周一','9/15 周二','9/16 周三','9/17 周四','9/18 周五','9/19 周六'];
  // 与 P37 办公楼管理保持一致：12 栋办公楼按楼群分组
  const groups = [
    {g:'国贸三期组', buildings:[
      {n:'A 座', state:'营业中'},
      {n:'B 座', state:'营业中'},
      {n:'C 座', state:'待开通'},
      {n:'D 座', state:'营业中'},
    ]},
    {g:'建外 SOHO 组', buildings:[{n:'建外 SOHO 北区', state:'营业中'}]},
    {g:'银泰中心组', buildings:[{n:'1 栋', state:'营业中'},{n:'2 栋', state:'营业中'}]},
    {g:'华贸组',     buildings:[{n:'1 号楼', state:'营业中'},{n:'2 号楼', state:'营业中'},{n:'3 号楼', state:'暂停'}]},
    {g:'远洋光华组', buildings:[{n:'AB 座', state:'营业中'},{n:'C 座', state:'营业中'}]},
  ];
  // 拍平所有楼栋用于矩阵（按楼群展示）
  const flatGroups = [];
  groups.forEach(g => {
    g.buildings.forEach(b => {
      flatGroups.push(`${g.g} ${b.n}`);
    });
  });
  const packages = ['红烧肉套餐','东坡肉套餐','宫保鸡丁套餐','清真牛肉套餐','番茄鱼套餐','啤酒鸭套餐','咖喱鸡套餐'];

  // 楼栋状态映射（与 P37 办公楼列表一致）
  const buildingStatus = {
    '国贸三期组 A 座': '营业中',
    '国贸三期组 B 座': '营业中',
    '国贸三期组 C 座': '待开通',
    '国贸三期组 D 座': '营业中',
    '建外 SOHO 组 建外 SOHO 北区': '营业中',
    '银泰中心组 1 栋': '营业中',
    '银泰中心组 2 栋': '营业中',
    '华贸组 1 号楼': '营业中',
    '华贸组 2 号楼': '营业中',
    '华贸组 3 号楼': '暂停',
    '远洋光华组 AB 座': '营业中',
    '远洋光华组 C 座': '营业中',
  };
  // 与下方矩阵绘制同一套规则统计（营业中 且 (di+gi)%3 !== 0 记为已分配）
  let assignedCount = 0, emptyCount = 0;
  dates.forEach((d, di) => {
    flatGroups.forEach((g, gi) => {
      if (buildingStatus[g] !== '营业中') return;
      if ((di + gi) % 3 !== 0) assignedCount++; else emptyCount++;
    });
  });

  let bodyHtml = `
  <div class="admin-page-actions" style="margin-bottom:14px;">
    <button style="padding:8px 16px;border-radius:14px;background:var(--bg-cream-light);border:1px solid var(--border-brown);cursor:pointer;font-family:var(--font-kai);" onclick="goToPage('P29')">📦 模板库</button>
    <button style="padding:8px 16px;border-radius:14px;background:var(--accent-gold);color:white;border:none;cursor:pointer;font-family:var(--font-kai);" onclick="goToPage('P28')">+ 新建套餐</button>
  </div>
  `;

  bodyHtml += `<div class="kpi-card"><div class="kpi-label">本周已分配</div><div class="kpi-value">${assignedCount}</div><div class="kpi-trend">↑ 12 vs 上周</div></div>`;
  bodyHtml += `<div class="kpi-card"><div class="kpi-label">未分配单元格</div><div class="kpi-value" style="color:var(--warning);">${emptyCount}</div><div class="kpi-trend" style="color:var(--warning);">需补排</div></div>`;

  bodyHtml += `<div style="background:var(--bg-cream-light);border-left:3px solid var(--info);border-radius:6px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--text-brown);line-height:1.7;">
    💡 矩阵展示的是 <strong>${flatGroups.length} 栋办公楼 × ${dates.length} 天</strong>（与 P37 办公楼管理保持一致）。<br/>
    📍 <strong>已开通楼栋</strong>（10 栋）可直接分配；待开通（国贸三期 C 座）/暂停（华贸 3 号楼）需先到 P37 调整状态。
  </div>`;

  bodyHtml += `<table class="matrix" style="margin-top:14px;"><thead><tr><th>日期 \\ 楼栋</th>`;
  flatGroups.forEach(g => bodyHtml += `<th style="font-size:10px;writing-mode:vertical-rl;">${g}</th>`);
  bodyHtml += `</tr></thead><tbody>`;

  dates.forEach((d, di) => {
    bodyHtml += `<tr><th>${d}</th>`;
    flatGroups.forEach((g, gi) => {
      const isOpen = buildingStatus[g] === '营业中';
      const assigned = isOpen && (di + gi) % 3 !== 0;
      const pname = packages[(di + gi) % packages.length];
      if (assigned) {
        bodyHtml += `<td><div class="matrix-cell-assigned" onclick="goToPage('P28')">${pname}</div></td>`;
      } else if (isOpen) {
        bodyHtml += `<td><div class="matrix-cell-empty" onclick="assignPackage(${di},${gi})">+</div></td>`;
      } else {
        bodyHtml += `<td><div style="background:var(--bg-cream);color:var(--text-brown-light);padding:6px;border-radius:6px;text-align:center;font-size:11px;">${buildingStatus[g]}</div></td>`;
      }
    });
    bodyHtml += `</tr>`;
  });
  bodyHtml += `</tbody></table>`;

  bodyHtml += `<div style="margin-top:18px;font-size:12px;color:var(--text-brown-light);">
    💡 提示：单元格点击可编辑；空单元格点击可分配套餐；右上角可批量复用模板或新建。
  </div>`;

  return adminShell(['P27'], bodyHtml, '🗓 套餐矩阵 · 日期 × 楼群');
}
function assignPackage(di, gi) {
  toast('📦', `已为 ${['9/13 周日','9/14 周一','9/15 周二','9/16 周三','9/17 周四','9/18 周五','9/19 周六'][di]} / 该楼栋 打开套餐选择`);
  setTimeout(() => goToPage('P28'), 1000);
}

// ============ 订单中心 Tab 切换 ============
function switchOrderTab(tab) {
  document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`orderTab-${tab}`).classList.add('active');
  document.getElementById('orderPanel-all').style.display = (tab === 'all') ? '' : 'none';
  document.getElementById('orderPanel-abnormal').style.display = (tab === 'abnormal') ? '' : 'none';
}

function _adminMobileNav(activeIdArr) {
  const html = ADMIN_NAV.map((g, gi) => {

    const items = g.items.map(it => `

// 把当前高亮项滚到导航条可视区中间（手机端切页后调用）
// 注意：后台页面会被预渲染出多份，必须锚定"当前可见的那个 .page"，不能用 getElementById
function scrollAdminNavIntoView() {
  const page = document.querySelector('.page.active');
  if (!page) return;
  const nav = page.querySelector('.admin-mobile-nav');
  if (!nav) return;
  const active = nav.querySelector('.admin-mobile-nav-item.active');
  if (!active) return;
  const target = active.offsetLeft - (nav.clientWidth - active.offsetWidth) / 2;
  nav.scrollLeft = Math.max(0, target);
}

// ============ 办公楼管理 Tab 切换 ============
function switchBuildingTab(tab) {
  document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`buildingTab-${tab}`).classList.add('active');
  ['overview','list','group','leader','hub'].forEach(t => {
    const p = document.getElementById(`buildingPanel-${t}`);
    if (p) p.style.display = (t === tab) ? '' : 'none';
  });
}
