  function sampleByUid(uid) { return ST.samples.filter(function (x) { return x.uid === uid; })[0] || null; }

  /** 问题归属：**不自己重算缺陷**，一律读 `Model.issues()` 的 `uids`。
      ⚠️ 这里刻意不写「码名白名单」—— 凡 `uids` 非空的缺陷自动进标记表，
         以后 model.js 新增一类缺陷，页面不用改也能标出来（白名单会静默漏掉新码）。 */
  function flagMap() {
    var m = {};
    M.issues(SPEC, ST.samples, ST.today, ST.nowClock).forEach(function (x) {
      (x.uids || []).forEach(function (u) { (m[u] = m[u] || []).push(x.code); });
    });
    return m;
  }

  /* ── 单元格 ─────────────────────────────────────────────── */
  function statePill(st) { return '<span class="pill ' + st.tone + '">' + esc(st.label) + '</span>'; }
  function photoCell(p) {
    if (!p) return '<div class="photo none">缺照片</div>';
    if (p === 'demo') return '<div class="photo demo">演示<br>占位</div>';
    return '<div class="photo has">已留档</div>';
  }
  function disposeCell(s, st) {
    if (st.key !== 'disposed') return '<span class="tiny">—</span>';
    return '<div class="mono">' + esc(U.addDays(ST.today, s.disposedDayOffset)) + ' '
      + esc(s.disposedClock) + '</div>';
  }
  function actCell(s, st) {
    if (st.key === 'due') {
      return '<button class="btn sm" data-act="due" data-uid="' + esc(s.uid) + '">标记处置</button>';
    }
    if (st.key === 'disposed') {
      return '<button class="btn sm ghost" data-act="undispose" data-uid="' + esc(s.uid) + '">清除处置</button>';
    }
    return '<button class="btn sm ghost" data-act="del" data-uid="' + esc(s.uid) + '">删除</button>';
  }

  /* ── 载入 / 保存 ────────────────────────────────────────── */
  function load() {
    var saved = U.store.get(KEY, null);
    M.setThresholds((saved && saved.thresholds) ? saved.thresholds : SPEC.keepPolicy);
    ST.samples = (saved && saved.samples && saved.samples.length)
      ? saved.samples.map(M.makeSample) : M.seed(SPEC);
    ST.checks = (saved && saved.checks && saved.checks.length)
      ? saved.checks.map(M.makeCheck) : M.seedChecks(SPEC);
    M.syncSeq(ST.samples);
    ST.today = U.today();
    ST.nowClock = nowHM();
    var bs = batches();
    if (!ST.traceBatch || !bs.filter(function (b) { return b.batchNo === ST.traceBatch; }).length) {
      ST.traceBatch = bs.length ? bs[0].batchNo : '';
    }
  }
  function save() {
    return U.store.set(KEY, { samples: ST.samples, checks: ST.checks,
                              thresholds: M.thresholds(), savedAt: new Date().toISOString() });
  }

  /* ── 侧栏 ───────────────────────────────────────────────── */
  function kpisHTML() {
    var s = M.summary(SPEC, ST.samples, ST.today, ST.nowClock);
    var kpi = function (k, v, tone) {
      return '<div class="kpi' + (tone ? ' ' + tone : '') + '"><div class="k">' + k + '</div>'
        + '<div class="v">' + v + '</div></div>';
    };
    return '<div class="kpis">'
      + kpi('出餐批次', s.batches)
      + kpi('留样样本', s.total)
      + kpi('保存中', s.holding)
      + kpi('可处置', s.due, s.due ? 'warn' : '')
      + kpi('已处置', s.disposed)
      + kpi('有照片', s.withPhoto + '<span class="u">/' + s.total + '</span>',
            s.withPhoto === s.total ? 'ok' : 'warn')
      + '</div>'
      + '<p class="hint" style="margin:10px 0 0">基准日 <b>' + esc(ST.today) + '</b> · 「现在」'
      + esc(ST.nowClock) + ' · 全部按本地日期算，不留存绝对日期</p>';
  }

      + '<div class="thbar">'

          return '<label><span>' + esc(SPEC.keepPolicy.labels[k]) + '</span>'

            + '<div class="b">' + md(SPEC.keepPolicy.basis[k]) + '</div></label>';
        }).join('')
      + '</div>'
      + '<label class="f" style="margin-top:10px"><span>「现在」时刻（决定「到不到期 / 是否提前处置」）</span>'
      + '<input id="nowclock" type="time" value="' + esc(ST.nowClock) + '"></label>'

        }).join('')

      + '</div>'

      + '<div class="card"><h2>操作</h2>'
      + '<div class="btnbar">'
      + '<button class="btn" data-act="addsample">＋ 补一项留样</button>'
      + '<button class="btn" data-act="export-csv">导出留样台账 CSV</button>'
      + '<button class="btn" data-act="export-trace">导出追溯链 CSV</button>'

  /* ── 主区 1：追溯卡（官方判据的落点）────────────────────── */
  function traceHTML() {

    if (!bs.length) {
      return '<div class="card"><h2>追溯卡</h2>'
        + '<div class="note warn">没有任何批次记录 —— 没有批次就谈不上留样与追溯。</div></div>';
    }
    var opts = bs.map(function (b) {
      return '<option value="' + esc(b.batchNo) + '"'
        + (b.batchNo === ST.traceBatch ? ' selected' : '') + '>'
        + esc(b.batchNo + ' · ' + U.addDays(ST.today, b.dayOffset) + ' · '
              + siteName(b.siteId) + ' · ' + setName(b.setMealId)) + '</option>';
    }).join('');
    var t = M.trace(SPEC, ST.samples, ST.traceBatch, ST.today, ST.nowClock);

      return '<div class="card"><h2>追溯卡</h2><div class="note warn">选中的批次不存在。</div></div>';

        + '<td><b>' + esc(r.dishName) + '</b></td>'
        + '<td class="nowrap">' + esc(catLabel(r.category)) + '</td>'
        + '<td>' + (r.supplier ? esc(r.supplier.name)
            : '<span class="tiny">集散中心统一供米</span>') + '</td>'
        + '<td class="nowrap">' + (r.supplier
            ? '<span class="mono">' + esc(r.supplier.licenseExpireAt || '—') + '</span> '
              + (r.supplierLicenseOk ? '<span class="pill ok">有效</span>'
                                     : '<span class="pill warn">已过期</span>')
            : '<span class="tiny">—</span>') + '</td>'
        + '<td class="mono">' + (r.sample ? esc(r.sample.uid) : '<span class="tiny">—</span>') + '</td>'
        + '<td class="num mono">' + (r.sample ? U.num(r.sample.weightG, 0) + 'g' : '—') + '</td>'
        + '<td class="num mono">' + (r.sample ? U.num(r.sample.tempC, 1) + '℃' : '—') + '</td>'
        + '<td class="mono nowrap">' + (r.times ? esc(r.times.sampleAt) : '—') + '</td>'
        + '<td>' + photoCell(r.photo) + '</td>'
        + '<td class="nowrap">' + (r.state ? statePill(r.state)
            : '<span class="pill warn">缺留样</span>') + '</td>'
        + '</tr>';
    }).join('');

    return '<div class="card"><h2>追溯卡 <span class="n">任取一份餐 → 查到留样照片与批次</span></h2>'
      + '<div class="tools"><label><span>任取一份餐（选一个批次）</span>'
      + '<select id="trace-batch">' + opts + '</select></label></div>'
      + ans
      + '<div class="chain">' + chain + '</div>'
      + '<div class="tw"><table><thead><tr>'
      + '<th style="width:104px">档位</th><th>菜品</th><th style="width:72px">类别</th>'
      + '<th style="width:112px">供应商</th><th style="width:152px">供应商证照到期</th>'
      + '<th style="width:58px">留样号</th><th style="width:62px" class="num">重量</th>'
      + '<th style="width:62px" class="num">温度</th><th style="width:72px">留样时刻</th>'
      + '<th style="width:64px">照片</th><th style="width:86px">状态</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      + '<p class="hint" style="margin:10px 0 0">出餐 <b>' + esc(t.batch.cookClock) + '</b> · 出餐人 '
      + esc(t.batch.cook) + ' · 配送发出 <b>' + esc(t.batch.dispatchClock) + '</b> · 场所 '
      + esc(siteName(t.batch.siteId)) + ' · 链条出处：' + md(SPEC.traceChain._src)
      + '<br>' + md(SPEC.suppliers._note) + '</p>'
      + '</div>';
  }

  /* ── 主区 2：留样台账（内联编辑）────────────────────────── */
  function ledgerHTML() {
    var q = (ST.q || '').trim().toLowerCase();
    var flags = flagMap();
    var list = ST.samples.filter(function (s) {
      var st = M.stateOf(SPEC, M.batchByNo(SPEC, s.batchNo), s, ST.today, ST.nowClock);
      if (ST.fstate === 'problem') { if (!flags[s.uid]) return false; }
      else if (ST.fstate !== 'all' && st.key !== ST.fstate) return false;
      if (!q) return true;
      return (s.batchNo + s.dishName + s.sampler + s.uid + supName(s.supplierId))
        .toLowerCase().indexOf(q) >= 0;
    });
    var rows = list.map(function (s) {
      var b = M.batchByNo(SPEC, s.batchNo);
      var st = M.stateOf(SPEC, b, s, ST.today, ST.nowClock);
      var fl = flags[s.uid] || [];
      var tag = ' data-uid="' + esc(s.uid) + '" data-field="';
      return '<tr data-row="' + esc(s.uid) + '">'
        + '<td class="mono nowrap">' + esc(s.uid) + '</td>'
        + '<td class="mono nowrap">' + esc(s.batchNo)
        + (b ? '' : ' <span class="pill warn">批次不存在</span>') + '</td>'
        + '<td class="nowrap">' + esc(M.slotLabel(SPEC, s.slot))
        + (s.staple ? ' <span class="pill gold">主食</span>' : '') + '</td>'
        + '<td><b>' + esc(s.dishName) + '</b>'
        + '<div class="tiny" data-cell="flags">' + esc(fl.join(' / ')) + '</div></td>'
        + '<td><input type="number" step="1" min="0"' + tag + 'weightG" value="' + s.weightG + '"></td>'
        + '<td><input type="number" step="0.5"' + tag + 'tempC" value="'
        + (s.tempC == null ? '' : s.tempC) + '"></td>'
        + '<td><input type="time"' + tag + 'sampleClock" value="' + esc(s.sampleClock) + '"></td>'
        + '<td><input' + tag + 'sampler" value="' + esc(s.sampler) + '"></td>'
        + '<td>' + photoCell(s.photo) + '</td>'
        + '<td><input' + tag + 'photo" value="' + esc(s.photo)
        + '" placeholder="照片文件名 / demo"></td>'
        + '<td><input' + tag + 'disposeWay" value="' + esc(s.disposeWay)
        + '" placeholder="有处置必须先填"></td>'
        + '<td class="nowrap" data-cell="disp">' + disposeCell(s, st) + '</td>'
        + '<td class="nowrap" data-cell="state">' + statePill(st) + '</td>'
        + '<td class="nowrap" data-cell="acts">' + actCell(s, st) + '</td>'
        + '</tr>';
    }).join('');
    return '<div class="card"><h2>留样台账 <span class="n">' + ST.samples.length
      + ' 样 · 可直接编辑</span></h2>'
      + '<p class="hint">「留样号」是这条记录的唯一标识；<b>重量 / 温度 / 留样时刻 / 留样人 / 照片</b>'
      + '五项逐样必填 —— 缺任何一项，出事时这一样就自证不了。要处置必须先填处置方式。</p>'
      + '<div class="tw"><table><thead><tr>'
      + '<th style="width:50px">留样号</th><th style="width:116px">批次</th>'
      + '<th style="width:102px">档位</th><th>菜品</th>'
      + '<th style="width:72px" class="num">重量g</th><th style="width:72px" class="num">温度℃</th>'
      + '<th style="width:86px">留样时刻</th><th style="width:78px">留样人</th>'
      + '<th style="width:64px">照片</th><th style="width:126px">照片凭证</th>'
      + '<th style="width:146px">处置方式</th><th style="width:128px">处置时刻</th>'
      + '<th style="width:78px">状态</th><th style="width:84px"></th>'
      + '</tr></thead><tbody>'
      + (rows || '<tr><td colspan="14" class="hint">没有匹配的留样记录</td></tr>')
      + '</tbody></table></div></div>';
  }

  /* ── 主区 3：出餐环境自检 ───────────────────────────────── */
  function checkGroups() {
    var all = batches(), seen = {}, out = [];
    all.forEach(function (b) {
      var k = M.checkKey(b.siteId, b.dayOffset);
      if (seen[k]) return;
      seen[k] = 1;
      out.push({ key: k, siteId: b.siteId, dayOffset: b.dayOffset,
                 date: U.addDays(ST.today, b.dayOffset),
                 batchNos: all.filter(function (x) {
                   return M.checkKey(x.siteId, x.dayOffset) === k;
                 }).map(function (x) { return x.batchNo; }) });
    });
    return U.sortBy(out, function (x) { return x.dayOffset; }, 'desc');
  }
  function ensureCheck(siteId, dayOffset) {
    var k = M.checkKey(siteId, dayOffset);
    var c = ST.checks.filter(function (x) { return x.key === k; })[0];
    if (!c) {
      c = M.makeCheck({ key: k, siteId: siteId, dayOffset: dayOffset, items: {}, by: '' });
      ST.checks.push(c);
    }
    return c;
  }
  function checksHTML() {
    var keys = M.checkKeys(SPEC);
    var byKey = {};
    ST.checks.forEach(function (c) { byKey[c.key] = c; });
    var gapMap = {};
    M.checkGaps(SPEC, ST.checks).forEach(function (x) {
      (gapMap[x.key] = gapMap[x.key] || []).push(x.why);
    });
    var defs = ((SPEC.siteChecks || {}).list) || [];
    var rows = checkGroups().map(function (gp) {
      var c = byKey[gp.key];
      var gs = gapMap[gp.key] || [];
      var items = keys.map(function (k) {
        var def = defs.filter(function (x) { return x.key === k; })[0] || { label: k, basis: '' };
        return '<label><input type="checkbox" data-ck="' + esc(gp.key) + '" data-item="' + esc(k) + '"'
          + ((c && c.items[k]) ? ' checked' : '') + '>'
          + '<span>' + esc(def.label) + '<div class="b">' + esc(def.basis) + '</div></span></label>';
      }).join('');
      return '<tr>'
        + '<td><b>' + esc(siteName(gp.siteId)) + '</b>'
        + '<div class="tiny">' + esc(gp.date) + ' · ' + esc(gp.batchNos.join('、')) + '</div></td>'
        + '<td><div class="ck">' + items + '</div></td>'
        + '<td><input data-ckby="' + esc(gp.key) + '" value="' + esc(c ? c.by : '')
        + '" placeholder="执行人"></td>'
        + '<td class="nowrap">' + (gs.length
            ? '<span class="pill warn">' + gs.length + ' 处缺口</span>'
              + '<div class="tiny">' + esc(gs.join('；')) + '</div>'
            : '<span class="pill ok">齐备</span>'
              + (c && c.demo ? '<div class="tiny">演示记录</div>' : ''))
        + '</td></tr>';
    }).join('');
    return '<div class="card"><h2>出餐环境自检 <span class="n">场所 × 出餐日 · 逐项打勾</span></h2>'
      + '<p class="hint">' + md(SPEC.sites_note) + '</p>'
      + '<div class="tw"><table><thead><tr>'
      + '<th style="width:216px">出餐场所 × 出餐日</th><th>自检项</th>'
      + '<th style="width:108px">执行人</th><th style="width:186px">状态</th>'
      + '</tr></thead><tbody>'
      + (rows || '<tr><td colspan="4" class="hint">没有批次，无需自检</td></tr>')
      + '</tbody></table></div></div>';
  }

  /* ── 主区 4：自检 ───────────────────────────────────────── */
  function gateHTML() {
    var r = SC.run(SPEC, ST.samples, ST.checks, ST.today, ST.nowClock);
    return '<div class="card"><h2>自检 <span class="n">' + (r.ok ? '全绿' : r.bad + ' 项不符')
      + ' · 待办 ' + r.todos.length + '</span></h2>'
      + '<div class="gate">'
      + r.rows.map(function (x, i) {
          return '<div class="g' + (x.ok ? '' : ' bad') + '"><i>'
            + String(i + 1).padStart(2, '0') + '</i>'
            + '<span class="t">' + (x.ok ? '✔ ' : '✗ ') + esc(x.name)
            + (x.detail ? ' —— ' + esc(x.detail) : '') + '</span></div>';
        }).join('')
      + '</div>'
      + (r.todos.length ? '<div class="note warn" style="margin-top:10px"><div><b>待办 ' + r.todos.length
          + ' 条</b>（不是缺陷，是该填 / 该换的）：<br>'
          + r.todos.map(function (x) { return '· ' + esc(x); }).join('<br>') + '</div></div>' : '')
      + '<p class="hint" style="margin:10px 0 0">这 ' + r.rows.length
      + ' 条判据与构建期是<b>同一份实现</b>（SelfCheck.run）—— 页面改了参数，判据立即按新参数算。'
      + '<br>真源：' + md(SPEC._srcs.seed) + ' · ' + md(SPEC._srcs.traceability)
      + ' · ' + md(SPEC._srcs.distributionCenter) + ' · 留样参数：' + md(SPEC._srcs.keepPolicy) + '</p>'
      + '</div>';
  }

  /* ── 渲染 ───────────────────────────────────────────────── */
  function mainHTML() {
    return '<div id="trace">' + traceHTML() + '</div>'
      + '<div id="ledger">' + ledgerHTML() + '</div>'
      + '<div id="checks">' + checksHTML() + '</div>'
      + '<div id="gate">' + gateHTML() + '</div>';
  }
  function render() {
    U.$('#side').innerHTML = sideHTML();
    U.$('#main').innerHTML = mainHTML();
    var sel = U.$('#fstate'); if (sel) sel.value = ST.fstate;
  }
  function R(id, html) { var el = U.$('#' + id); if (el) el.innerHTML = html; }
  function refreshKpis() { R('kpis', kpisHTML()); }
  function refreshTrace() { R('trace', traceHTML()); }
  function refreshLedger() { R('ledger', ledgerHTML()); }
  function refreshChecks() { R('checks', checksHTML()); }
  function refreshGate() { R('gate', gateHTML()); }
  /** 侧栏参数/时刻变了之后的统一刷新。⚠️ **不含侧栏本身**：
      侧栏里有正在输入的参数框，重渲染会掉焦点。 */
  function refreshDerived() {
    refreshKpis(); refreshTrace(); refreshLedger(); refreshChecks(); refreshGate();
  }
  /** 只刷新某一行的派生单元格（避免整表重建导致输入框失焦） */
  function touchSample(uid) {
    var s = sampleByUid(uid);
    var tr = U.$('[data-row="' + uid + '"]');
    if (!s || !tr || typeof tr.querySelector !== 'function') return;
    var st = M.stateOf(SPEC, M.batchByNo(SPEC, s.batchNo), s, ST.today, ST.nowClock);
    var fl = flagMap()[uid] || [];
    var c1 = tr.querySelector('[data-cell="state"]'); if (c1) c1.innerHTML = statePill(st);
    var c2 = tr.querySelector('[data-cell="disp"]'); if (c2) c2.innerHTML = disposeCell(s, st);
    var c3 = tr.querySelector('[data-cell="acts"]'); if (c3) c3.innerHTML = actCell(s, st);
    var c4 = tr.querySelector('[data-cell="flags"]'); if (c4) c4.textContent = fl.join(' / ');
  }

  /* ── 交互 ───────────────────────────────────────────────── */
  function addsample() {
    var b = M.batchByNo(SPEC, ST.traceBatch);
    if (!b) { g.alert('先在「追溯卡」里选一个批次。'); return; }
    var got = M.samplesOf(ST.samples, b.batchNo);
    var miss = M.expectedItems(SPEC, b.setMealId).filter(function (it) {
      return !got.filter(function (s) {
        return it.staple ? s.staple : (!s.staple && String(s.dishId) === String(it.dishId));
      }).length;
    });
    if (!miss.length) { g.alert('批次 ' + b.batchNo + ' 的留样已经齐了，没有可补的。'); return; }
    var it = miss[0];
    var d = SPEC.sampleDefaults || {};
    var cookM = M.clockMin(b.cookClock);
    var lag = Number(d.sampleLagMin == null ? 8 : d.sampleLagMin);
    ST.samples.push(M.makeSample({
      batchNo: b.batchNo, dishId: it.dishId, dishName: it.dishName, slot: it.slot,
      supplierId: it.supplierId, staple: it.staple,
      weightG: d.weightG, tempC: d.tempC,
      sampleClock: cookM == null ? '' : M.min2clock(cookM + lag),
      sampler: b.cook, photo: '',
      note: '补录：' + (it.staple ? '主食米饭（成本口径不计入 BOM，留样口径必留）' : '按套餐 BOM 派生'),
    }));
    save(); refreshDerived();
  }

  function onClick(e, t) {
    var act = t.getAttribute('data-act');
    if (!act) return;
    var uid = t.getAttribute('data-uid');

    if (act === 'del') {
      var s0 = sampleByUid(uid);
      if (s0 && g.confirm('删除留样记录「' + s0.dishName + '（' + s0.uid + '）」？\n'
        + '该批次会因此缺这一样，自检将报红 —— 除非这一样本来就不该留。')) {
        ST.samples = ST.samples.filter(function (x) { return x.uid !== uid; });
        save(); refreshDerived();
      }
    } else if (act === 'due') {
      var s1 = sampleByUid(uid);
      if (!s1) return;
      if (!s1.disposeWay) {
        g.alert('请先在「处置方式」里写清楚怎么处置的，再标记处置 —— 处置痕迹必须完整。');
        return;
      }
      s1.disposedDayOffset = 0;
      s1.disposedClock = ST.nowClock;
      save(); refreshDerived();
    } else if (act === 'undispose') {
      var s2 = sampleByUid(uid);
      if (s2 && g.confirm('清除这一样的处置记录？')) {
        s2.disposedDayOffset = null; s2.disposedClock = ''; s2.disposeWay = '';
        save(); refreshDerived();
      }
    } else if (act === 'addsample') {
      addsample();
    } else if (act === 'now') {
      ST.nowClock = nowHM();
      var nk = U.$('#nowclock'); if (nk) nk.value = ST.nowClock;
      refreshDerived();
    } else if (act === 'export-csv') {
      var head = ['序号', '留样号', '批次', '出餐日', '场所', '套餐', '档位', '菜品', '主食',
        '供应商', '供应商证照到期', '重量(g)', '保存温度(℃)', '留样时刻', '留样人', '照片凭证',
        '状态', '处置日', '处置时刻', '处置方式', '问题'];
      var flags = flagMap();
      var out = [head].concat(ST.samples.map(function (s, i) {
        var b = M.batchByNo(SPEC, s.batchNo);
        var st = M.stateOf(SPEC, b, s, ST.today, ST.nowClock);
        var sp = M.supplierIndex(SPEC)[s.supplierId];
        return [i + 1, s.uid, s.batchNo, b ? U.addDays(ST.today, b.dayOffset) : '',
          b ? siteName(b.siteId) : '', b ? setName(b.setMealId) : '', M.slotLabel(SPEC, s.slot),
          s.dishName, s.staple ? '是' : '', supName(s.supplierId),
          sp ? (sp.licenseExpireAt || '') : '', s.weightG, s.tempC == null ? '' : s.tempC,
          s.sampleClock, s.sampler, s.photo === 'demo' ? '演示占位' : s.photo, st.label,
          s.disposedDayOffset == null ? '' : U.addDays(ST.today, s.disposedDayOffset),
          s.disposedClock, s.disposeWay, (flags[s.uid] || []).join(' / ')];
      }));
      U.download('ABox留样台账-' + ST.today + '.csv', '\ufeff' + U.toCSV(out), 'text/csv');
    } else if (act === 'export-trace') {
      var head2 = ['批次', '出餐日', '场所', '出餐人', '出餐时刻', '配送发出', '套餐', '档位',
        '菜品', '供应商', '供应商证照到期', '留样号', '照片凭证', '状态'];
      var out2 = [head2];
      M.traces(SPEC, ST.samples, ST.today, ST.nowClock).forEach(function (x) {
        x.rows.forEach(function (r) {
          out2.push([x.batch.batchNo, x.mealDate, (x.site || {}).name || '', x.batch.cook,
            x.cookAt, x.dispatchAt, (x.setMeal || {}).name || '', r.slotLabel, r.dishName,
            r.supplier ? r.supplier.name : '集散中心统一供米',
            r.supplier ? (r.supplier.licenseExpireAt || '') : '',
            r.sample ? r.sample.uid : '',
            r.photo === 'demo' ? '演示占位' : (r.photo || ''),
            r.state ? r.state.label : '缺留样']);
        });
      });
      U.download('ABox追溯链-' + ST.today + '.csv', '\ufeff' + U.toCSV(out2), 'text/csv');
    } else if (act === 'export-json') {
      U.download('ABox留样与追溯-' + ST.today + '.json', JSON.stringify({
        product: 'F3 食安留样与全链追溯', version: VERSION,
        exportedAt: new Date().toISOString(), today: ST.today, nowClock: ST.nowClock,
        thresholds: M.thresholds(), samples: ST.samples, checks: ST.checks,
      }, null, 2), 'application/json');
    } else if (act === 'import') {
      U.pickFile('.json', function (txt) {
        try {
          var o = JSON.parse(txt);
          if (!o.samples || !o.samples.length) throw new Error('文件里没有 samples');
          ST.samples = o.samples.map(M.makeSample);
          ST.checks = (o.checks || []).map(M.makeCheck);
          if (o.thresholds) M.setThresholds(o.thresholds);
          M.syncSeq(ST.samples); save(); render();
          g.alert('已导入 ' + ST.samples.length + ' 条留样 · ' + ST.checks.length + ' 条自检记录');
        } catch (err) { g.alert('导入失败：' + err.message); }
      });
    } else if (act === 'reset') {
      if (g.confirm('重置为初始台账？当前编辑将丢失。')) {
        ST.samples = M.seed(SPEC); ST.checks = M.seedChecks(SPEC);
        M.syncSeq(ST.samples); save(); render();
      }
    }
  }

  function onField(e, t) {
    var get = function (k) { return (t.getAttribute ? t.getAttribute(k) : null); };

    /* ① 留样参数：唯一合法改参入口是 setter，否则「页面改了、判据没变」且不报错 */
    var thk = get('data-th');
    if (thk) {
      var o = {}; o[thk] = t.value;
      M.setThresholds(o); save();
      refreshDerived();
      if (e.type === 'change') t.value = M.thresholds()[thk];   /* 失焦时把越界/空值拉回真值 */
      return;
    }
    /* ② 「现在」时刻：只改 ST，**不重渲染侧栏**（否则这个输入框每敲一下就掉焦点） */
    if (t.id === 'nowclock') { ST.nowClock = t.value || ST.nowClock; refreshDerived(); return; }
    /* ③ 换批次 */
    if (t.id === 'trace-batch') { ST.traceBatch = t.value; refreshTrace(); refreshGate(); return; }
    /* ④ 筛选：会重渲染侧栏，手动把焦点接回输入框 */
    if (t.id === 'q' || t.id === 'fstate') {
      if (t.id === 'q') ST.q = t.value; else ST.fstate = t.value;
      render();
      if (t.id === 'q') {
        var q = U.$('#q');
        if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
      }
      return;
    }
    /* ⑤ 出餐环境自检（打勾 / 执行人）—— 记录不存在就**先补一条空记录**再改 */
    var ck = get('data-ck'), ckby = get('data-ckby');
    if (ck || ckby) {
      var key = ck || ckby;
      var gp = checkGroups().filter(function (x) { return x.key === key; })[0];
      if (!gp) return;
      var c = ensureCheck(gp.siteId, gp.dayOffset);
      if (ck) c.items[get('data-item')] = !!t.checked; else c.by = t.value;
      save(); refreshChecks(); refreshGate();
      return;
    }
    /* ⑥ 留样台账字段 */
    var uid = get('data-uid'), f = get('data-field');
    if (!uid || !f) return;
    if (['weightG', 'tempC', 'sampleClock', 'sampler', 'photo', 'disposeWay'].indexOf(f) < 0) return;
    var s = sampleByUid(uid);
    if (!s) return;
    if (f === 'weightG') s.weightG = Number(t.value);
    else if (f === 'tempC') s.tempC = (t.value === '' ? null : Number(t.value));
    else s[f] = t.value;
    save();
    touchSample(uid);
    refreshKpis(); refreshTrace(); refreshGate();
  }

  function boot() {
    load();
    var v = U.$('#ver'); if (v) v.textContent = VERSION;
    var d = U.$('#date'); if (d) d.textContent = ST.today;
    U.on('click', '[data-act]', onClick);
    U.on('input', 'input, select', onField);
    U.on('change', 'input, select', onField);
    render();
    document.documentElement.setAttribute('data-tool-ready', '1');
  }

  g.F3 = {
    state: function () { return ST; },
    render: render,
    /* 供构建期与探针取的**真实渲染串**（= 屏上会出现的那一份，不含源码注释） */
    html: function () { return sideHTML() + mainHTML(); },
    selfcheck: function () { return SC.run(SPEC, ST.samples, ST.checks, ST.today, ST.nowClock); },
    seed: function () { return M.seed(SPEC); },
    seedChecks: function () { return M.seedChecks(SPEC); },
    summary: function () { return M.summary(SPEC, ST.samples, ST.today, ST.nowClock); },
    issues: function () { return M.issues(SPEC, ST.samples, ST.today, ST.nowClock); },
    flags: function () { return flagMap(); },
    trace: function (b) { return M.trace(SPEC, ST.samples, b || ST.traceBatch, ST.today, ST.nowClock); },
    traces: function () { return M.traces(SPEC, ST.samples, ST.today, ST.nowClock); },
    checkGroups: checkGroups,
    thresholds: function () { return M.thresholds(); },
    setThresholds: function (o) { M.setThresholds(o); render(); return M.thresholds(); },
    traceChain: function () { return (SPEC.traceChain || {}).list || []; },
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script></body></html>
